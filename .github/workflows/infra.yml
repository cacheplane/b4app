name: Infra

# Plans both environment roots on every pull request that touches Infra, and
# applies on main: test first, then prod behind the `production` environment's
# required reviewer. Roles come from repository variables (ARNs, not secrets):
# AWS_ROLE_PLAN_<ENV> for plans, AWS_ROLE_INFRA_<ENV> for applies, and the
# state key from TFSTATE_KMS_KEY_ARN_<ENV>. B4HUB_ALARM_EMAIL is the address
# the alarm topic and budget notify.
#
# OIDC subjects: a job that declares `environment:` presents the subject
# repo:cacheplane/b4app:environment:<name>; any other job on main presents
# ref:refs/heads/main. The test infra role trusts the ref subject, the prod one
# trusts environment:production, so apply-test declares no environment (it would
# be refused) and apply-prod declares production, which also gates it on the
# reviewer. Apply jobs allow 90 minutes because the first apply can wait up to
# 60 minutes on certificate validation.

on:
  pull_request:
    paths:
      - "Infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "Infra/**"
      - ".github/workflows/infra.yml"

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  test:
    name: Module tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0
      - name: Format check
        run: terraform fmt -check -recursive Infra
      - name: Validate, lint, and test the bootstrap root against a mocked provider
        working-directory: Infra/bootstrap
        run: |
          terraform init -backend=false
          terraform validate
          tflint --config ../.tflint.hcl --init
          tflint --config ../.tflint.hcl
          terraform test
      - name: Lint and test the hub module against a mocked provider
        working-directory: Infra/modules/hub
        run: |
          terraform init -backend=false
          tflint --config ../../.tflint.hcl --init
          tflint --config ../../.tflint.hcl
          terraform test

  plan:
    name: Plan ${{ matrix.environment }}
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Plans and applies use separate groups so a pull request's plan never
    # queues behind a 90-minute apply; the plan waits on the state lock instead.
    concurrency:
      group: infra-plan-${{ matrix.environment }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: test
            role: ${{ vars.AWS_ROLE_PLAN_TEST }}
            kms_key: ${{ vars.TFSTATE_KMS_KEY_ARN_TEST }}
          - environment: prod
            role: ${{ vars.AWS_ROLE_PLAN_PROD }}
            kms_key: ${{ vars.TFSTATE_KMS_KEY_ARN_PROD }}
    env:
      TF_VAR_alarm_email: ${{ vars.B4HUB_ALARM_EMAIL }}
    defaults:
      run:
        working-directory: Infra/envs/${{ matrix.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.65.0
      - name: Format check
        run: terraform fmt -check -recursive ../..
      - name: Check the AWS repository variables
        # Until the owner has bootstrapped the account (Infra/README.md runbook 1)
        # and recorded the role and KMS ARNs as repository variables, there is
        # nothing to plan against. The job then validates and lints only, and says so.
        id: aws
        env:
          ROLE: ${{ matrix.role }}
          KMS_KEY: ${{ matrix.kms_key }}
          ENV_NAME: ${{ matrix.environment }}
        run: |
          if [ -n "$ROLE" ] && [ -n "$KMS_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No AWS account for ${ENV_NAME} yet::AWS_ROLE_PLAN and TFSTATE_KMS_KEY_ARN repository variables are not set for ${ENV_NAME}; running fmt, validate, and tflint only. Bootstrap the account and add the variables (Infra/README.md, runbook 1) to enable plans."
          fi
      - name: Configure AWS credentials
        if: steps.aws.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ matrix.role }}
          aws-region: us-east-2
          mask-aws-account-id: true
      - name: Initialize
        if: steps.aws.outputs.configured == 'true'
        env:
          ENV_NAME: ${{ matrix.environment }}
          KMS_KEY: ${{ matrix.kms_key }}
        run: |
          terraform init \
            -backend-config="bucket=b4hub-${ENV_NAME}-tfstate" \
            -backend-config="key=hub.tfstate" \
            -backend-config="region=us-east-2" \
            -backend-config="kms_key_id=${KMS_KEY}" \
            -backend-config="encrypt=true"
      - name: Initialize without a backend
        if: steps.aws.outputs.configured != 'true'
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate
      - name: Lint
        run: |
          tflint --config ../../.tflint.hcl --init
          tflint --config ../../.tflint.hcl
      - name: Plan
        if: steps.aws.outputs.configured == 'true'
        run: terraform plan -no-color -input=false -lock-timeout=10m -out plan.bin
      - name: Summarize the plan
        if: steps.aws.outputs.configured == 'true'
        # The repository is public: the comment carries counts and resource
        # addresses only, never attribute values (account id, ARNs, email).
        # The full plan is in the Plan step's log above.
        run: |
          set -euo pipefail
          terraform show -json plan.bin | jq -r '
            [(.resource_changes // [])[] | select(.change.actions != ["no-op"] and .change.actions != ["read"])] as $c
            | if ($c | length) == 0 then "No resource changes."
              else
                "Plan: \([$c[] | select(.change.actions | index("create"))] | length) to add, \([$c[] | select(.change.actions == ["update"])] | length) to change, \([$c[] | select(.change.actions | index("delete"))] | length) to destroy (a replacement counts as both an add and a destroy).",
                "",
                ($c[] | "- `\(.address)`: \(.change.actions | join(" + "))")
              end
          ' > "$RUNNER_TEMP/plan.txt"
      - name: Comment the plan on the pull request
        if: steps.aws.outputs.configured == 'true'
        continue-on-error: false
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ENV_NAME: ${{ matrix.environment }}
          PLAN_FILE: ${{ runner.temp }}/plan.txt
        with:
          script: |
            const fs = require('fs');
            const env = process.env.ENV_NAME;
            const marker = `<!-- infra-plan-${env} -->`;
            let plan = fs.readFileSync(process.env.PLAN_FILE, 'utf8');
            const limit = 60000;
            if (plan.length > limit) {
              plan = plan.slice(0, limit) + '\n... truncated';
            }
            const body = `${marker}\n### Terraform plan: ${env}\n\n${plan}\n\nThe full plan is in the workflow run log.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body && c.body.startsWith(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

  apply-test:
    name: Apply test
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    concurrency:
      group: infra-apply-test
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      TF_VAR_alarm_email: ${{ vars.B4HUB_ALARM_EMAIL }}
    defaults:
      run:
        working-directory: Infra/envs/test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Check the AWS repository variables
        # Nothing to apply until the owner has bootstrapped the account and
        # recorded the role and KMS ARNs (Infra/README.md runbook 1).
        id: aws
        env:
          ROLE: ${{ vars.AWS_ROLE_INFRA_TEST }}
          KMS_KEY: ${{ vars.TFSTATE_KMS_KEY_ARN_TEST }}
        run: |
          if [ -n "$ROLE" ] && [ -n "$KMS_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No AWS account for test yet::AWS_ROLE_INFRA_TEST and TFSTATE_KMS_KEY_ARN_TEST are not set; skipping the apply. Bootstrap the account and add the variables (Infra/README.md, runbook 1)."
          fi
      - name: Configure AWS credentials
        if: steps.aws.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_INFRA_TEST }}
          aws-region: us-east-2
          mask-aws-account-id: true
      - name: Initialize
        if: steps.aws.outputs.configured == 'true'
        env:
          KMS_KEY: ${{ vars.TFSTATE_KMS_KEY_ARN_TEST }}
        run: |
          terraform init \
            -backend-config="bucket=b4hub-test-tfstate" \
            -backend-config="key=hub.tfstate" \
            -backend-config="region=us-east-2" \
            -backend-config="kms_key_id=${KMS_KEY}" \
            -backend-config="encrypt=true"
      - name: Plan
        if: steps.aws.outputs.configured == 'true'
        run: terraform plan -no-color -input=false -out plan.bin
      - name: Apply
        if: steps.aws.outputs.configured == 'true'
        run: terraform apply -no-color -input=false plan.bin

  apply-prod:
    name: Apply prod
    if: github.event_name == 'push'
    needs: apply-test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production
    concurrency:
      group: infra-apply-prod
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    env:
      TF_VAR_alarm_email: ${{ vars.B4HUB_ALARM_EMAIL }}
    defaults:
      run:
        working-directory: Infra/envs/prod
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.17.1
          terraform_wrapper: false
      - name: Check the AWS repository variables
        # Nothing to apply until the owner has bootstrapped the account and
        # recorded the role and KMS ARNs (Infra/README.md runbook 1).
        id: aws
        env:
          ROLE: ${{ vars.AWS_ROLE_INFRA_PROD }}
          KMS_KEY: ${{ vars.TFSTATE_KMS_KEY_ARN_PROD }}
        run: |
          if [ -n "$ROLE" ] && [ -n "$KMS_KEY" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=No AWS account for prod yet::AWS_ROLE_INFRA_PROD and TFSTATE_KMS_KEY_ARN_PROD are not set; skipping the apply. Bootstrap the account and add the variables (Infra/README.md, runbook 1)."
          fi
      - name: Configure AWS credentials
        if: steps.aws.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_INFRA_PROD }}
          aws-region: us-east-2
          mask-aws-account-id: true
      - name: Initialize
        if: steps.aws.outputs.configured == 'true'
        env:
          KMS_KEY: ${{ vars.TFSTATE_KMS_KEY_ARN_PROD }}
        run: |
          terraform init \
            -backend-config="bucket=b4hub-prod-tfstate" \
            -backend-config="key=hub.tfstate" \
            -backend-config="region=us-east-2" \
            -backend-config="kms_key_id=${KMS_KEY}" \
            -backend-config="encrypt=true"
      - name: Plan
        if: steps.aws.outputs.configured == 'true'
        run: terraform plan -no-color -input=false -out plan.bin
      - name: Apply
        if: steps.aws.outputs.configured == 'true'
        run: terraform apply -no-color -input=false plan.bin
