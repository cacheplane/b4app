name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The merge queue (D-242) tests each pull request on top of main and the ones queued before it.
  merge_group:

# A newer push to a pull request cancels its older run; a push to main never cancels the one before
# it, which saves the build caches at its end (D-244).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

jobs:
  # Whether this change needs the macOS jobs. A pull request that touches only Hub/, Infra/, docs/ or
  # a root Markdown file does not: nothing those jobs build or test reads them (Scripts/ci_scope.py).
  # GitHub runs five macOS jobs at once for the whole organisation, so a run that needs none leaves
  # the runners to the runs that do. A push to main always runs everything, and so does any change
  # this job is not sure about: the jobs below skip only on an explicit "false". A merge group is
  # judged on its whole change from main (every pull request queued so far), from git's own diff.
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apple: ${{ steps.scope.outputs.apple }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Decide
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
          GROUP_BASE: ${{ github.event.merge_group.base_sha }}
          GROUP_HEAD: ${{ github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = merge_group ]; then
            git fetch --no-tags --depth=1 origin "$GROUP_BASE"
            git diff --no-renames --name-only "$GROUP_BASE" "$GROUP_HEAD" > "$RUNNER_TEMP/changed.txt"
            python3 Scripts/ci_scope.py --expected "$(wc -l < "$RUNNER_TEMP/changed.txt")" \
              < "$RUNNER_TEMP/changed.txt" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "apple=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
          python3 Scripts/ci_scope.py --expected "$CHANGED_FILES" < "$RUNNER_TEMP/changed.txt" \
            | tee -a "$GITHUB_OUTPUT"

  b4-runtime:
    name: B4 runtime integration (aimock)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 24.20.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
      - name: Install pinned dependencies
        run: npm ci --prefix Tests/B4Runtime --ignore-scripts --no-audit --no-fund
      - name: Run real B4 runtime integration cases
        run: npm test --prefix Tests/B4Runtime
      - name: Save synthetic B4 runtime artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: b4-runtime-aimock-results
          path: .build/B4Runtime/
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: Workflow and shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint 1.7.12
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Install bats 1.14.0
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/bats.tar.gz" \
            https://github.com/bats-core/bats-core/archive/refs/tags/v1.14.0.tar.gz
          echo "bb537b70b15b732f6d8827dd6578e3d8ce166636ce1f18ea9a074184fcce9177  $RUNNER_TEMP/bats.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/bats.tar.gz" -C "$RUNNER_TEMP"
          sudo "$RUNNER_TEMP/bats-core-1.14.0/install.sh" /usr/local
          bats --version
      - name: actionlint
        run: actionlint
      - name: shellcheck
        run: |
          shopt -s nullglob
          shellcheck .github/scripts/*.sh Hub/scripts/*.sh Hub/chart/scripts/*.sh Infra/scripts/*.sh Infra/scripts/tests/stubs/* Infra/scripts/tests/helpers.bash Scripts/docs-index.sh Scripts/fix-app-registrations.sh Scripts/package-dist.sh Scripts/test-ios-layout.sh Scripts/test-macos-smoke.sh Scripts/tests/stubs/*
      - name: Fetch main for the decision-number check
        run: git fetch --no-tags --depth=1 origin main
      - name: Decision and verification records
        run: Scripts/docs-index.sh --check
      - name: Release tag guard test
        run: .github/scripts/test-tag-guard.sh
      - name: Deploy script tests
        run: bats Infra/scripts/tests
      - name: B4 fixture startup regression tests
        run: python3 -m unittest discover -s Scripts/tests -p 'test_*.py' -v
      - name: Launch Services script tests
        run: bats Scripts/tests

  # Build caches (D-244). A push to main builds from clean, runs everything, and only then saves its
  # build output under its commit; pull requests and merge groups restore the newest of main's and
  # never save, so a stale cache can touch only those runs and main is proven from clean every merge.
  # Scripts/restore_mtimes.py sets each file's time from its content first: a checkout gives every
  # file the checkout's time, which would make a restored build rebuild everything.
  package:
    name: Package build and tests
    runs-on: macos-26
    timeout-minutes: 45
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.apple != 'false' }}
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: File times from content
        run: python3 Scripts/restore_mtimes.py
      - name: Restore the SwiftPM build
        if: github.event_name != 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: spm-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.resolved') }}-
      - name: Format lint
        run: swift format lint --strict --recursive Sources Tests Apps Package.swift
      - name: Cache the pinned PostgreSQL archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/postgres-dl
          key: postgres-dl-${{ hashFiles('Scripts/fetch-postgres.sh') }}
      - name: Fetch PostgreSQL (the tests boot a private cluster from it)
        run: ./Scripts/fetch-postgres.sh
      - name: Build
        run: swift build
      # The storage and coordinator tests wait on PostgreSQL synchronously, from Swift's cooperative
      # threads (one per core). In one process with everything else they held all of the runner's
      # threads for the first minute (CI's samples: every thread in libpq, most in CREATE DATABASE),
      # so no other test ran and those that wait on a clock (MirrorSyncTests) timed out. They run in
      # a process of their own, then the rest, both on one cluster that a single test starts first.
      - name: Start the tests' PostgreSQL
        env:
          B4APP_TEST_POSTGRES_DIR: ${{ runner.temp }}/pg
        run: swift test --filter 'AccountRegistryTests/aLedgerIsCreatedOnlyWhenMissing'
      - name: Test
        env:
          B4APP_TEST_POSTGRES_DIR: ${{ runner.temp }}/pg
        run: |
          status=0
          swift test --skip-build --filter '^(WorkspaceStorageTests|CoordinatorTests)\.' || status=1
          swift test --skip-build --skip '^(WorkspaceStorageTests|CoordinatorTests)\.' || status=1
          exit "$status"
      - name: Save the SwiftPM build
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.resolved') }}-${{ github.sha }}

  # The debug iOS and macOS app builds, in one DerivedData, beside the test jobs. The beta builds
  # differ only in Config/Flavor-beta.xcconfig and are built at release, not here (D-244).
  app-builds:
    name: App builds
    runs-on: macos-26
    timeout-minutes: 30
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.apple != 'false' }}
    outputs:
      ios-app: ${{ steps.ios-app.outcome }}
      macos-app: ${{ steps.macos-app.outcome }}
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Cache SwiftPM (xcodebuild)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .spm
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-xcode-${{ runner.os }}-
      - name: File times from content
        run: python3 Scripts/restore_mtimes.py
      - name: Restore DerivedData
        if: github.event_name != 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/AppDerivedData/Build
            .build/AppDerivedData/ModuleCache.noindex
          key: dd-apps-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: dd-apps-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.resolved') }}-
      - name: Generate project
        run: ./Scripts/generate-project.sh
      - name: Build iOS app (simulator)
        id: ios-app
        run: >
          xcodebuild build -project B4App.xcodeproj -scheme B4App-iOS -destination 'generic/platform=iOS Simulator'
          -clonedSourcePackagesDirPath .spm -derivedDataPath .build/AppDerivedData CODE_SIGNING_ALLOWED=NO -showBuildTimingSummary
      - name: Build macOS app
        id: macos-app
        if: ${{ !cancelled() }}
        run: >
          xcodebuild build -project B4App.xcodeproj -scheme B4App-macOS -destination 'platform=macOS'
          -clonedSourcePackagesDirPath .spm -derivedDataPath .build/AppDerivedData CODE_SIGNING_ALLOWED=NO -showBuildTimingSummary
      - name: Save DerivedData
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/AppDerivedData/Build
            .build/AppDerivedData/ModuleCache.noindex
          key: dd-apps-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.resolved') }}-${{ github.sha }}

  # The required check for the two app builds. It always runs and reads the build steps' own
  # outcomes: a build that failed, was cancelled or never ran fails it, and the one skip it accepts is
  # the scope job's explicit "false".
  apps:
    name: macOS and iOS app builds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [scope, app-builds]
    if: always()
    permissions: {}
    steps:
      - name: Every app build passed
        env:
          APPLE: ${{ needs.scope.outputs.apple }}
          JOBS: ${{ needs.app-builds.result }}
          IOS: ${{ needs.app-builds.outputs.ios-app }}
          MACOS: ${{ needs.app-builds.outputs.macos-app }}
        run: |
          echo "scope: apple=$APPLE; job: $JOBS; iOS build: $IOS; macOS build: $MACOS"
          if [ "$APPLE" = false ] && [ "$JOBS" = skipped ]; then
            echo "This change touches nothing the apps are built from."
            exit 0
          fi
          test "$IOS" = success
          test "$MACOS" = success

  # The fixture app builds from the package, not from the app builds, so it runs beside them.
  # "ios-layout-result" below reports it under the name the branch protection requires.
  ios-layout:
    name: iOS layout tests
    runs-on: macos-26
    timeout-minutes: 30
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.apple != 'false' }}
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Cache SwiftPM (xcodebuild)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .spm
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-xcode-${{ runner.os }}-
      - name: File times from content
        run: python3 Scripts/restore_mtimes.py
      - name: Restore DerivedData
        if: github.event_name != 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/DerivedData/Build
            .build/DerivedData/ModuleCache.noindex
          key: dd-ios-layout-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: dd-ios-layout-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.resolved') }}-
      - name: Begin iOS Simulator boot
        id: simulator
        # The listing may take 5 minutes on a cold runner and the boot call 1.
        timeout-minutes: 7
        run: python3 Scripts/prepare_ios_layout_simulator.py --github-output "$GITHUB_OUTPUT"
      # Builds while the Simulator boots, for no device, so it never waits on the boot; the boot and
      # the build each take two to three minutes on a hosted runner.
      - name: Build the layout tests
        env:
          B4APP_LAYOUT_DERIVED_DATA: .build/DerivedData
        run: ./Scripts/test-ios-layout.sh --build-only -clonedSourcePackagesDirPath .spm
      - name: iOS navigation and banner regression tests
        env:
          B4APP_LAYOUT_SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          B4APP_LAYOUT_DESTINATION: ${{ steps.simulator.outputs.destination }}
          B4APP_LAYOUT_DERIVED_DATA: .build/DerivedData
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$B4APP_LAYOUT_SIMULATOR_UDID" -b
          ./Scripts/test-ios-layout.sh --without-building -clonedSourcePackagesDirPath .spm
      - name: Save iOS layout screenshots and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-layout-results
          path: .build/iOSLayout/Results-*.xcresult
          retention-days: 7
      - name: Save DerivedData
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/DerivedData/Build
            .build/DerivedData/ModuleCache.noindex
          key: dd-ios-layout-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.resolved') }}-${{ github.sha }}

  # The required check. It always runs, so a cancelled or skipped layout job fails it instead of
  # leaving it skipped, which the branch protection would take for a pass. The one skip it accepts is
  # the scope job's: a change that touches nothing these tests read.
  ios-layout-result:
    name: iOS navigation and banner regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [scope, ios-layout]
    if: always()
    permissions: {}
    steps:
      - name: Every shard passed
        env:
          APPLE: ${{ needs.scope.outputs.apple }}
          SHARDS: ${{ needs.ios-layout.result }}
        run: |
          echo "scope: apple=$APPLE; iOS layout job: $SHARDS"
          if [ "$APPLE" = false ] && [ "$SHARDS" = skipped ]; then
            echo "This change touches nothing the layout tests read."
            exit 0
          fi
          test "$SHARDS" = success

  macos-smoke:
    name: macOS recovery smoke tests
    runs-on: macos-26
    timeout-minutes: 20
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.apple != 'false' }}
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Set up Node.js 24.20.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: Tests/B4Runtime/package-lock.json
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Cache SwiftPM (xcodebuild)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .spm
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-xcode-${{ runner.os }}-
      - name: Cache the pinned PostgreSQL archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/postgres-dl
          key: postgres-dl-${{ hashFiles('Scripts/fetch-postgres.sh') }}
      - name: File times from content
        run: python3 Scripts/restore_mtimes.py
      - name: Restore DerivedData
        if: github.event_name != 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/macOSSmoke/DerivedData/Build
            .build/macOSSmoke/DerivedData/ModuleCache.noindex
          key: dd-macos-smoke-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: dd-macos-smoke-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.resolved') }}-
      - name: macOS recovery smoke tests
        # The virtual desktop is 1024 points wide; keep both journeys fully on-screen.
        run: ./Scripts/test-macos-smoke.sh B4APP_SMOKE_DESKTOP_WIDTH=1000 -clonedSourcePackagesDirPath .spm
      - name: Save macOS screenshots and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-smoke-results
          path: .build/macOSSmoke/Results-*.xcresult
          retention-days: 7
      - name: Save DerivedData
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/macOSSmoke/DerivedData/Build
            .build/macOSSmoke/DerivedData/ModuleCache.noindex
          key: dd-macos-smoke-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.resolved') }}-${{ github.sha }}

  hub:
    name: Hub (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Hub
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests create a database per test, so they connect as the superuser.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust 1.93.1
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.93.1
      - name: Cache Cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Hub/target
          key: hub-cargo-${{ runner.os }}-${{ hashFiles('Hub/Cargo.lock') }}
          restore-keys: hub-cargo-${{ runner.os }}-
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
