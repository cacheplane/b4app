name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package build and tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Format lint
        run: swift format lint --strict --recursive Sources Tests Apps Package.swift
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  apps:
    name: macOS and iOS app builds
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: ./Scripts/generate-project.sh
      - name: Cache SwiftPM (xcodebuild)
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-xcode-${{ runner.os }}-
      - name: Build macOS app
        run: >
          xcodebuild build -project B4App.xcodeproj -scheme B4App-macOS -destination 'platform=macOS'
          -clonedSourcePackagesDirPath .spm -derivedDataPath .build/DerivedData CODE_SIGNING_ALLOWED=NO
      - name: Build iOS app (simulator)
        run: >
          xcodebuild build -project B4App.xcodeproj -scheme B4App-iOS -destination 'generic/platform=iOS Simulator'
          -clonedSourcePackagesDirPath .spm -derivedDataPath .build/DerivedData CODE_SIGNING_ALLOWED=NO
