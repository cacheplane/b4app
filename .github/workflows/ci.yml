name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Whether this change needs the macOS jobs. A pull request that touches only Hub/, Infra/, docs/ or
  # a root Markdown file does not: nothing those jobs build or test reads them (Scripts/ci_scope.py).
  # GitHub runs five macOS jobs at once for the whole organisation, so a run that needs none leaves
  # the runners to the runs that do. A push to main always runs everything, and so does any change
  # this job is not sure about: the jobs below skip only on an explicit "false".
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      apple: ${{ steps.scope.outputs.apple }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Decide
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED_FILES: ${{ github.event.pull_request.changed_files }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "apple=true" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$RUNNER_TEMP/changed.txt"
          python3 Scripts/ci_scope.py --expected "$CHANGED_FILES" < "$RUNNER_TEMP/changed.txt" \
            | tee -a "$GITHUB_OUTPUT"

  b4-runtime:
    name: B4 runtime integration (aimock)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 24.20.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
      - name: Install pinned dependencies
        run: npm ci --prefix Tests/B4Runtime --ignore-scripts --no-audit --no-fund
      - name: Run real B4 runtime integration cases
        run: npm test --prefix Tests/B4Runtime
      - name: Save synthetic B4 runtime artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: b4-runtime-aimock-results
          path: .build/B4Runtime/
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: Workflow and shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint 1.7.12
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Install bats 1.14.0
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/bats.tar.gz" \
            https://github.com/bats-core/bats-core/archive/refs/tags/v1.14.0.tar.gz
          echo "bb537b70b15b732f6d8827dd6578e3d8ce166636ce1f18ea9a074184fcce9177  $RUNNER_TEMP/bats.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/bats.tar.gz" -C "$RUNNER_TEMP"
          sudo "$RUNNER_TEMP/bats-core-1.14.0/install.sh" /usr/local
          bats --version
      - name: actionlint
        run: actionlint
      - name: shellcheck
        run: |
          shopt -s nullglob
          shellcheck .github/scripts/*.sh Hub/scripts/*.sh Hub/chart/scripts/*.sh Infra/scripts/*.sh Infra/scripts/tests/stubs/* Infra/scripts/tests/helpers.bash Scripts/docs-index.sh Scripts/fix-app-registrations.sh Scripts/package-dist.sh Scripts/test-ios-layout.sh Scripts/test-macos-smoke.sh Scripts/tests/stubs/*
      - name: Fetch main for the decision-number check
        run: git fetch --no-tags --depth=1 origin main
      - name: Decision and verification records
        run: Scripts/docs-index.sh --check
      - name: Release tag guard test
        run: .github/scripts/test-tag-guard.sh
      - name: Deploy script tests
        run: bats Infra/scripts/tests
      - name: B4 fixture startup regression tests
        run: python3 -m unittest discover -s Scripts/tests -p 'test_*.py' -v
      - name: Launch Services script tests
        run: bats Scripts/tests

  package:
    name: Package build and tests
    runs-on: macos-26
    timeout-minutes: 45
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.apple != 'false' }}
    outputs:
      ios-apps: ${{ steps.ios-app.outcome }}/${{ steps.ios-beta.outcome }}
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Format lint
        run: swift format lint --strict --recursive Sources Tests Apps Package.swift
      - name: Cache the pinned PostgreSQL archive
        uses: actions/cache@v4
        with:
          path: .build/postgres-dl
          key: postgres-dl-${{ hashFiles('Scripts/fetch-postgres.sh') }}
      - name: Fetch PostgreSQL (the tests boot a private cluster from it)
        run: ./Scripts/fetch-postgres.sh
      - name: Build
        run: swift build
      # The storage and coordinator tests wait on PostgreSQL synchronously, from Swift's cooperative
      # threads (one per core). In one process with everything else they held all of the runner's
      # threads for the first minute (CI's samples: every thread in libpq, most in CREATE DATABASE),
      # so no other test ran and those that wait on a clock (MirrorSyncTests) timed out. They run in
      # a process of their own, then the rest, both on one cluster that a single test starts first.
      - name: Start the tests' PostgreSQL
        env:
          B4APP_TEST_POSTGRES_DIR: ${{ runner.temp }}/pg
        run: swift test --filter 'AccountRegistryTests/aLedgerIsCreatedOnlyWhenMissing'
      - name: Test
        env:
          B4APP_TEST_POSTGRES_DIR: ${{ runner.temp }}/pg
        run: |
          status=0
          swift test --skip-build --filter '^(WorkspaceStorageTests|CoordinatorTests)\.' || status=1
          swift test --skip-build --skip '^(WorkspaceStorageTests|CoordinatorTests)\.' || status=1
          exit "$status"
      # The two iOS app builds, which had a macOS job of their own with the two macOS builds (those
      # are in the smoke job). They run whatever the tests did, and the "apps" job below reports all
      # four under the required name from these steps' outcomes, not from this job's result.
      - name: Install XcodeGen
        if: ${{ !cancelled() }}
        run: brew install xcodegen
      - name: Generate project
        if: ${{ !cancelled() }}
        run: ./Scripts/generate-project.sh
      - name: Cache SwiftPM (xcodebuild)
        if: ${{ !cancelled() }}
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-xcode-${{ runner.os }}-
      # DerivedData stays out of .build, which the SwiftPM cache above saves.
      - name: Build iOS app (simulator)
        id: ios-app
        if: ${{ !cancelled() }}
        run: >
          xcodebuild build -project B4App.xcodeproj -scheme B4App-iOS -destination 'generic/platform=iOS Simulator'
          -clonedSourcePackagesDirPath .spm -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO -showBuildTimingSummary
      - name: Build iOS app (beta, simulator)
        id: ios-beta
        if: ${{ !cancelled() }}
        run: >
          xcodebuild build -project B4App.xcodeproj -scheme B4App-iOS-Beta -destination 'generic/platform=iOS Simulator'
          -clonedSourcePackagesDirPath .spm -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO -showBuildTimingSummary

  # The required check for the four app builds. The builds are steps of two jobs that already hold
  # a macOS runner (iOS in "package", macOS in "macos-smoke"), so a run asks for four macOS runners
  # where it asked for five. This job always runs and reads the build steps' own outcomes: a failed
  # test in either job does not fail it, and a build that failed, was cancelled or never ran does.
  apps:
    name: macOS and iOS app builds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [scope, package, macos-smoke]
    if: always()
    permissions: {}
    steps:
      - name: Every app build passed
        env:
          APPLE: ${{ needs.scope.outputs.apple }}
          JOBS: ${{ needs.package.result }}/${{ needs.macos-smoke.result }}
          IOS: ${{ needs.package.outputs.ios-apps }}
          MACOS: ${{ needs.macos-smoke.outputs.macos-apps }}
        run: |
          echo "scope: apple=$APPLE; jobs: $JOBS; iOS builds: $IOS; macOS builds: $MACOS"
          if [ "$APPLE" = false ] && [ "$JOBS" = skipped/skipped ]; then
            echo "This change touches nothing the apps are built from."
            exit 0
          fi
          test "$IOS" = success/success
          test "$MACOS" = success/success

  # The fixture app builds from the package, not from the app builds, so it runs beside them.
  # Two shards of the reviewed plan (Tests/iOSLayout/UITests/shards.json), each checked against the
  # whole plan; "ios-layout-result" below reports them under the name the branch protection requires.
  ios-layout:
    name: iOS layout tests (shard ${{ matrix.shard }} of 2)
    runs-on: macos-26
    timeout-minutes: 30
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.apple != 'false' }}
    strategy:
      # A failure in one shard says nothing about the other's tests: let both report.
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Cache SwiftPM (xcodebuild)
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-xcode-${{ runner.os }}-
      - name: Begin iOS Simulator boot
        id: simulator
        # The listing may take 5 minutes on a cold runner and the boot call 1.
        timeout-minutes: 7
        run: python3 Scripts/prepare_ios_layout_simulator.py --github-output "$GITHUB_OUTPUT"
      - name: iOS navigation and banner regression tests
        env:
          B4APP_LAYOUT_SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          B4APP_LAYOUT_DESTINATION: ${{ steps.simulator.outputs.destination }}
          B4APP_LAYOUT_DERIVED_DATA: .build/DerivedData
          B4APP_LAYOUT_SHARD: ${{ matrix.shard }}
          B4APP_LAYOUT_FOCUSED_COVERAGE: "0"
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$B4APP_LAYOUT_SIMULATOR_UDID" -b
          ./Scripts/test-ios-layout.sh -clonedSourcePackagesDirPath .spm
      - name: Save iOS layout screenshots and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-layout-results-shard-${{ matrix.shard }}
          path: .build/iOSLayout/Results-*.xcresult
          retention-days: 7

  # The required check. It always runs, so a cancelled or skipped shard fails it instead of leaving
  # it skipped, which the branch protection would take for a pass. The one skip it accepts is the
  # scope job's: a change that touches nothing these tests read.
  ios-layout-result:
    name: iOS navigation and banner regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [scope, ios-layout]
    if: always()
    permissions: {}
    steps:
      - name: Every shard passed
        env:
          APPLE: ${{ needs.scope.outputs.apple }}
          SHARDS: ${{ needs.ios-layout.result }}
        run: |
          echo "scope: apple=$APPLE; iOS layout shards: $SHARDS"
          if [ "$APPLE" = false ] && [ "$SHARDS" = skipped ]; then
            echo "This change touches nothing the layout tests read."
            exit 0
          fi
          test "$SHARDS" = success

  macos-smoke:
    name: macOS recovery smoke tests
    runs-on: macos-26
    # 20 for the smoke tests as before, and the two app builds.
    timeout-minutes: 30
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.apple != 'false' }}
    outputs:
      macos-apps: ${{ steps.macos-app.outcome }}/${{ steps.macos-beta.outcome }}
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Set up Node.js 24.20.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: Tests/B4Runtime/package-lock.json
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Cache SwiftPM (xcodebuild)
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-xcode-${{ runner.os }}-
      - name: Cache the pinned PostgreSQL archive
        uses: actions/cache@v4
        with:
          path: .build/postgres-dl
          key: postgres-dl-${{ hashFiles('Scripts/fetch-postgres.sh') }}
      - name: macOS recovery smoke tests
        # The virtual desktop is 1024 points wide; keep both journeys fully on-screen.
        run: ./Scripts/test-macos-smoke.sh B4APP_SMOKE_DESKTOP_WIDTH=1000 -clonedSourcePackagesDirPath .spm
      - name: Save macOS screenshots and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-smoke-results
          path: .build/macOSSmoke/Results-*.xcresult
          retention-days: 7
      # The two macOS app builds (see "apps" above). They run whatever the smoke tests did.
      - name: Generate project
        if: ${{ !cancelled() }}
        run: ./Scripts/generate-project.sh
      - name: Build macOS app
        id: macos-app
        if: ${{ !cancelled() }}
        run: >
          xcodebuild build -project B4App.xcodeproj -scheme B4App-macOS -destination 'platform=macOS'
          -clonedSourcePackagesDirPath .spm -derivedDataPath .build/DerivedData CODE_SIGNING_ALLOWED=NO -showBuildTimingSummary
      - name: Build macOS app (beta)
        id: macos-beta
        if: ${{ !cancelled() }}
        run: >
          xcodebuild build -project B4App.xcodeproj -scheme B4App-macOS-Beta -destination 'platform=macOS'
          -clonedSourcePackagesDirPath .spm -derivedDataPath .build/DerivedData CODE_SIGNING_ALLOWED=NO -showBuildTimingSummary

  hub:
    name: Hub (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Hub
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests create a database per test, so they connect as the superuser.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust 1.93.1
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.93.1
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Hub/target
          key: hub-cargo-${{ runner.os }}-${{ hashFiles('Hub/Cargo.lock') }}
          restore-keys: hub-cargo-${{ runner.os }}-
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
