name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  b4-runtime:
    name: B4 runtime integration (aimock)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js 24.20.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
      - name: Install pinned dependencies
        run: npm ci --prefix Tests/B4Runtime --ignore-scripts --no-audit --no-fund
      - name: Run real B4 runtime integration cases
        run: npm test --prefix Tests/B4Runtime
      - name: Save synthetic B4 runtime artifacts
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: b4-runtime-aimock-results
          path: .build/B4Runtime/
          if-no-files-found: ignore
          retention-days: 7

  lint:
    name: Workflow and shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint 1.7.12
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Install bats 1.14.0
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/bats.tar.gz" \
            https://github.com/bats-core/bats-core/archive/refs/tags/v1.14.0.tar.gz
          echo "bb537b70b15b732f6d8827dd6578e3d8ce166636ce1f18ea9a074184fcce9177  $RUNNER_TEMP/bats.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/bats.tar.gz" -C "$RUNNER_TEMP"
          sudo "$RUNNER_TEMP/bats-core-1.14.0/install.sh" /usr/local
          bats --version
      - name: actionlint
        run: actionlint
      - name: shellcheck
        run: |
          shopt -s nullglob
          shellcheck .github/scripts/*.sh Hub/scripts/*.sh Hub/chart/scripts/*.sh Infra/scripts/*.sh Infra/scripts/tests/stubs/* Infra/scripts/tests/helpers.bash Scripts/docs-index.sh Scripts/fix-app-registrations.sh Scripts/package-dist.sh Scripts/test-ios-layout.sh Scripts/test-macos-smoke.sh Scripts/tests/stubs/*
      - name: Fetch main for the decision-number check
        run: git fetch --no-tags --depth=1 origin main
      - name: Decision and verification records
        run: Scripts/docs-index.sh --check
      - name: Release tag guard test
        run: .github/scripts/test-tag-guard.sh
      - name: Deploy script tests
        run: bats Infra/scripts/tests
      - name: B4 fixture startup regression tests
        run: python3 -m unittest discover -s Scripts/tests -p 'test_*.py' -v
      - name: Launch Services script tests
        run: bats Scripts/tests

  package:
    name: Package build and tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Format lint
        run: swift format lint --strict --recursive Sources Tests Apps Package.swift
      - name: Cache the pinned PostgreSQL archive
        uses: actions/cache@v4
        with:
          path: .build/postgres-dl
          key: postgres-dl-${{ hashFiles('Scripts/fetch-postgres.sh') }}
      - name: Fetch PostgreSQL (the tests boot a private cluster from it)
        run: ./Scripts/fetch-postgres.sh
      - name: Build
        run: swift build
      - name: Focused socket ownership and shutdown regressions
        id: socket-ownership-controls
        run: swift test --filter 'SocketResponseOwnershipTests|SocketLifecycleTests|SocketClosePreservationTests|OwnedCloseConcurrencyTests|SocketServerShutdownTests'
      - name: Focused Agent Protocol transport regressions
        run: swift test --filter AgentProtocolTransportTests
      - name: Focused Agent Protocol foundation regressions
        run: swift test --filter 'AgentProtocol|ProtocolProjectionStoreTests|ProtocolActivation'
      - name: Focused Node probe observation controls
        id: node-probe-control
        run: swift test --filter NodeVersionProbeObservationTests
      - name: Test
        if: ${{ !cancelled() && (success() || steps.node-probe-control.outcome == 'failure') }}
        run: swift test
      - name: Sample owner-carrier build metadata (compiler controls held)
        id: owner-carrier-metadata
        if: ${{ !cancelled() && steps.socket-ownership-controls.outcome == 'success' }}
        timeout-minutes: 1
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import math
          import os
          from pathlib import Path
          import re
          import stat
          import sys
          import tempfile

          MAX_INPUT = 4 * 1024 * 1024
          MAX_RECORD = 256 * 1024
          MAX_NODES = 16384
          MAX_DEPTH = 64
          SOURCE_PINS = {
              "Sources/Coordinator/HubSync/HubOwnerCarrier.swift": "217eee004c3d36fbeffc4a7efb96bc9eee955ca656eacc0e000dcb619332f51b",
              "Sources/Coordinator/Accounts/AccountManager.swift": "06119d341433560101eca806f4497eb4ae93b9b99c06db2968ce33e8520d2cfe",
              "Sources/Coordinator/HubSync/HubSync.swift": "1e5524a1fb3616c6ce2db218168b3c4d144ba57821c51b5c06dbdbcdc2b7338c",
              "Sources/WorkspaceStorage/ProtocolActivation.swift": "19c70eaee753786a2493f12aa4af074070ce60bc93bd1796d28226d88418ae99",
              "Tests/CoordinatorTests/HubOwnerCarrierTests.swift": "23a1c01b827d4d0ee1c533ba5c0391500efd37c28d0fa71182eecb43c70af23f",
          }

          class Rejected(Exception):
              pass

          def require(condition):
              if not condition:
                  raise Rejected()

          def safe_string(value):
              require(isinstance(value, str) and len(value) <= MAX_RECORD)
              require(not any(ord(c) < 32 or 127 <= ord(c) <= 159 for c in value))
              require(re.search(r"(?:bearer\s|secret:|secretref:|secret-reference:)", value, re.IGNORECASE) is None)
              return value

          def contained(path, anchor):
              require(path != anchor and path.is_relative_to(anchor))
              return path

          def read_regular(path, anchor):
              resolved = contained(path.resolve(strict=True), anchor)
              fd = os.open(resolved, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(fd, "rb") as stream:
                  before = os.fstat(stream.fileno())
                  require(stat.S_ISREG(before.st_mode) and before.st_size <= MAX_INPUT)
                  data = stream.read(MAX_INPUT + 1)
                  after = os.fstat(stream.fileno())
                  require(len(data) <= MAX_INPUT and len(data) == before.st_size)
                  require((before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns)
                          == (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns))
              return resolved, data

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result)
                  result[key] = value
              return result

          def finite_float(value):
              parsed = float(value)
              require(math.isfinite(parsed))
              return parsed

          def reject_constant(_value):
              raise Rejected()

          def json_type(value):
              if value is None:
                  return "null"
              if isinstance(value, bool):
                  return "boolean"
              if isinstance(value, dict):
                  return "object"
              if isinstance(value, list):
                  return "array"
              if isinstance(value, str):
                  return "string"
              if isinstance(value, int):
                  return "integer"
              if isinstance(value, float):
                  return "number"
              raise Rejected()

          def typed_fields(value):
              require(len(value) <= 256)
              return [{"key": safe_string(key), "type": json_type(item)} for key, item in value.items()]

          def validate_selected(value):
              pending = [(value, 0)]
              count = 0
              while pending:
                  item, depth = pending.pop()
                  count += 1
                  require(count <= MAX_NODES and depth <= MAX_DEPTH)
                  if isinstance(item, dict):
                      require(len(item) <= MAX_NODES - count)
                      for key, child in item.items():
                          safe_string(key)
                          require(key.casefold() not in ("env", "environ", "environment"))
                          pending.append((key, depth + 1))
                          pending.append((child, depth + 1))
                  elif isinstance(item, list):
                      require(len(item) <= MAX_NODES - count)
                      pending.extend((child, depth + 1) for child in item)
                  elif isinstance(item, str):
                      safe_string(item)
                  elif isinstance(item, float):
                      require(math.isfinite(item))
                  else:
                      json_type(item)
                  require(len(pending) + count <= MAX_NODES)
              return count

          def main():
              checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
              require(checkout.is_dir())
              build = contained((checkout / ".build").resolve(strict=True), checkout)
              require(build.is_dir())
              description_path, description_bytes = read_regular(build / "debug/description.json", build)
              try:
                  description = json.loads(description_bytes.decode("utf-8"), object_pairs_hook=unique_object,
                                           parse_float=finite_float, parse_constant=reject_constant)
              except (ValueError, UnicodeError, RecursionError):
                  raise Rejected() from None
              require(isinstance(description, dict))
              top_fields = typed_fields(description)
              commands = description.get("swiftCommands")
              require(isinstance(commands, dict) and len(commands) <= 256)
              require(all(isinstance(command, dict) for command in commands.values()))
              selected = [(key, command) for key, command in commands.items()
                          if isinstance(command.get("moduleName"), str) and command["moduleName"] == "CoordinatorTests"]
              require(len(selected) == 1)
              selected_key, selected_command = selected[0]
              safe_string(selected_key)
              selected_nodes = validate_selected(selected_command)
              selected_fields = typed_fields(selected_command)

              module_path = description_path.parent / "Modules/Coordinator.swiftmodule"
              contained(module_path.resolve(strict=False), build)
              module_exists = os.path.lexists(module_path)
              if module_exists:
                  require(stat.S_ISREG(module_path.lstat().st_mode))
                  contained(module_path.resolve(strict=True), build)

              source_hashes = {}
              for relative, expected in SOURCE_PINS.items():
                  _, content = read_regular(checkout / relative, checkout)
                  actual = hashlib.sha256(content).hexdigest()
                  require(actual == expected)
                  source_hashes[relative] = actual
              _, workflow_bytes = read_regular(checkout / ".github/workflows/ci.yml", checkout)
              sha = os.environ["GITHUB_SHA"]
              run_id = os.environ["GITHUB_RUN_ID"]
              attempt = os.environ["GITHUB_RUN_ATTEMPT"]
              require(re.fullmatch(r"[0-9a-f]{40}", sha) is not None)
              require(re.fullmatch(r"[1-9][0-9]{0,19}", run_id) is not None)
              require(re.fullmatch(r"[1-9][0-9]{0,9}", attempt) is not None)
              record = {
                  "schema_version": 1,
                  "kind": "METADATA_ONLY_COMPILER_CONTROLS_HELD",
                  "compiler_controls": {"count": 3, "status": "HELD", "semantic_vectors_qualified": False},
                  "semantic_fields_qualified": False,
                  "github": {"sha": sha, "run_id": run_id, "run_attempt": attempt},
                  "description": {"requested_relative_path": ".build/debug/description.json",
                                  "resolved_relative_path": safe_string(str(description_path.relative_to(checkout))),
                                  "sha256": hashlib.sha256(description_bytes).hexdigest(),
                                  "bytes": len(description_bytes), "top_level_fields": top_fields,
                                  "swift_commands_count": len(commands)},
                  "selected_command_key": selected_key,
                  "selected_command": selected_command,
                  "selected_command_fields": selected_fields,
                  "selected_tree_nodes": selected_nodes,
                  "source_sha256": source_hashes,
                  "workflow_sha256": hashlib.sha256(workflow_bytes).hexdigest(),
                  "coordinator_module": {"relative_to_description_parent": "Modules/Coordinator.swiftmodule",
                                         "exists": module_exists, "freshness_proven": False, "import_proven": False},
              }
              encoded = (json.dumps(record, ensure_ascii=True, allow_nan=False, sort_keys=True,
                                    separators=(",", ":")) + "\n").encode("utf-8")
              require(len(encoded) <= MAX_RECORD)
              runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
              require(runner_temp.is_dir())
              output_directory = Path(tempfile.mkdtemp(prefix="owner-carrier-metadata-", dir=runner_temp))
              os.chmod(output_directory, 0o700)
              directory_info = output_directory.lstat()
              require(stat.S_ISDIR(directory_info.st_mode) and stat.S_IMODE(directory_info.st_mode) == 0o700)
              sample_path = contained(output_directory / "sample.json", runner_temp)
              safe_string(str(sample_path))
              fd = os.open(sample_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
              with os.fdopen(fd, "wb") as stream:
                  os.fchmod(stream.fileno(), 0o600)
                  require(stream.write(encoded) == len(encoded))
                  stream.flush()
                  os.fsync(stream.fileno())
                  info = os.fstat(stream.fileno())
                  require(stat.S_ISREG(info.st_mode) and info.st_size == len(encoded))
                  require(stat.S_IMODE(info.st_mode) == 0o600)
              final_info = sample_path.lstat()
              require(stat.S_ISREG(final_info.st_mode) and final_info.st_size == len(encoded))
              require(stat.S_IMODE(final_info.st_mode) == 0o600)
              require((final_info.st_dev, final_info.st_ino) == (info.st_dev, info.st_ino))
              output_path = contained(Path(os.environ["GITHUB_OUTPUT"]).resolve(strict=True), runner_temp)
              fd = os.open(output_path, os.O_WRONLY | os.O_APPEND | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(fd, "w", encoding="utf-8") as output:
                  require(stat.S_ISREG(os.fstat(output.fileno()).st_mode))
                  output_line = "sample-path=" + str(sample_path) + "\n"
                  require(output.write(output_line) == len(output_line))
                  output.flush()
              print("owner_carrier_metadata_finalized")
              print("description_sha256=" + record["description"]["sha256"])
              print("sample_sha256=" + hashlib.sha256(encoded).hexdigest())
              print("sample_bytes=" + str(len(encoded)))
              print("selected_tree_nodes=" + str(selected_nodes))
              print("swift_commands_count=" + str(len(commands)))
              print("source_hash_count=" + str(len(source_hashes)))

          try:
              main()
          except Rejected:
              print("owner_carrier_metadata_rejected", file=sys.stderr)
              sys.exit(1)
          except Exception:
              print("infrastructure_failure", file=sys.stderr)
              sys.exit(1)
          PY
      - name: Save owner-carrier metadata sample
        if: ${{ !cancelled() && steps.owner-carrier-metadata.outcome == 'success' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owner-carrier-metadata
          path: ${{ steps.owner-carrier-metadata.outputs.sample-path }}
          retention-days: 7
          if-no-files-found: error
      - name: Owner-carrier origin compiler access controls
        id: owner-carrier-origin-controls
        if: ${{ !cancelled() && steps.socket-ownership-controls.outcome == 'success' && steps.owner-carrier-metadata.outcome == 'success' }}
        timeout-minutes: 1
        env:
          OWNER_CARRIER_METADATA_SAMPLE: ${{ steps.owner-carrier-metadata.outputs.sample-path }}
        run: |
          python3 -I - <<'PY'
          try:
              import os
              import sys
              import time
              START = time.monotonic()
              PARENT_END = START + 50.0
              import hashlib
              import json
              import math
              from pathlib import Path
              import re
              import selectors
              import signal
              import stat
              import subprocess
              import tempfile
              CANCELLED = False
              OWNERS = []
              FAILURE_CLEANUP_USED = False
              DECLARATION_NOTE_OBSERVATION = None
              MAX_INPUT = 4194304
              MAX_SAMPLE = 262144
              MAX_OUTPUT = 65536
              SOURCE_PINS = {'Sources/Coordinator/Accounts/AccountManager.swift': '06119d341433560101eca806f4497eb4ae93b9b99c06db2968ce33e8520d2cfe', 'Sources/Coordinator/HubSync/HubOwnerCarrier.swift': '217eee004c3d36fbeffc4a7efb96bc9eee955ca656eacc0e000dcb619332f51b', 'Sources/Coordinator/HubSync/HubSync.swift': '1e5524a1fb3616c6ce2db218168b3c4d144ba57821c51b5c06dbdbcdc2b7338c', 'Sources/WorkspaceStorage/ProtocolActivation.swift': '19c70eaee753786a2493f12aa4af074070ce60bc93bd1796d28226d88418ae99', 'Tests/CoordinatorTests/HubOwnerCarrierTests.swift': '23a1c01b827d4d0ee1c533ba5c0391500efd37c28d0fa71182eecb43c70af23f'}
              SOURCE_NAMES = ['AccountCommandTests.swift', 'AccountManagerTests.swift', 'AgentProtocolAccountMigrationL2Tests.swift', 'AgentProtocolAccountMigrationTests.swift', 'AgentProtocolArchiveATests.swift', 'AgentProtocolConnectionIdentityTests.swift', 'AgentProtocolFoundationFixture.swift', 'AgentProtocolGrantCredentialTests.swift', 'AgentProtocolIdentityManagedFixtures.swift', 'AgentProtocolLegacyManagedTests.swift', 'AgentProtocolMainTenAccountReopenTests.swift', 'AgentProtocolMigrationBackupPathTests.swift', 'AgentProtocolPrivateBackupTests.swift', 'AgentProtocolResourceFixture.swift', 'AgentProtocolRetirementTests.swift', 'AgentProtocolUnicodeIdentityTests.swift', 'CoordinatorTests.swift', 'EnvironmentServiceTests.swift', 'FakeB4Project.swift', 'HubLinkRelayTests.swift', 'HubOwnerCarrierTests.swift', 'HubPullTests.swift', 'HubSyncTests.swift', 'InspectionObservation.swift', 'InspectionObservationTests.swift', 'InspectionRequestObservation.swift', 'InspectionRequestObservationTests.swift', 'KeepAwakeTests.swift', 'LaunchAgentInstallTests.swift', 'LauncherTests.swift', 'LegacyAdoptionLiveTests.swift', 'LegacyAdoptionTests.swift', 'LocalServerTests.swift', 'OwnedCloseConcurrencyTests.swift', 'PairingTests.swift', 'RelayExecutorTests.swift', 'SessionTests.swift', 'SignedInCoordinator.swift', 'SleepWatcherTests.swift', 'SocketClosePreservationTests.swift', 'SocketLifecycleTests.swift', 'SocketResponseOwnershipTests.swift', 'SocketServerShutdownTests.swift', 'SyncSignal.swift', 'ThreadDeleteTests.swift', 'UsageTests.swift']
              ARGUMENT_TEMPLATE = ['-target', 'arm64-apple-macosx26.0', '-incremental', '-enable-batch-mode', '-serialize-diagnostics', '-index-store-path', '{CHECKOUT}/.build/arm64-apple-macosx/debug/index/store', '-Onone', '-enable-testing', '-Xfrontend', '-enable-cross-import-overlays', '-j3', '-DSWIFT_PACKAGE', '-DDEBUG', '-DSWIFT_MODULE_RESOURCE_BUNDLE_UNAVAILABLE', '-Xcc', '-fmodule-map-file={CHECKOUT}/.build/arm64-apple-macosx/debug/CNIOLLHTTP.build/module.modulemap', '-Xcc', '-I', '-Xcc', '{CHECKOUT}/.build/checkouts/swift-nio/Sources/CNIOLLHTTP/include', '-Xcc', '-fmodule-map-file={CHECKOUT}/.build/arm64-apple-macosx/debug/CNIOAtomics.build/module.modulemap', '-Xcc', '-I', '-Xcc', '{CHECKOUT}/.build/checkouts/swift-nio/Sources/CNIOAtomics/include', '-Xcc', '-fmodule-map-file={CHECKOUT}/.build/checkouts/swift-atomics/Sources/_AtomicsShims/include/module.modulemap', '-Xcc', '-I', '-Xcc', '{CHECKOUT}/.build/checkouts/swift-atomics/Sources/_AtomicsShims/include', '-Xcc', '-fmodule-map-file={CHECKOUT}/.build/arm64-apple-macosx/debug/CNIOWASI.build/module.modulemap', '-Xcc', '-I', '-Xcc', '{CHECKOUT}/.build/checkouts/swift-nio/Sources/CNIOWASI/include', '-Xcc', '-fmodule-map-file={CHECKOUT}/.build/checkouts/swift-nio/Sources/CNIOWindows/include/module.modulemap', '-Xcc', '-I', '-Xcc', '{CHECKOUT}/.build/checkouts/swift-nio/Sources/CNIOWindows/include', '-Xcc', '-fmodule-map-file={CHECKOUT}/.build/arm64-apple-macosx/debug/CNIOLinux.build/module.modulemap', '-Xcc', '-I', '-Xcc', '{CHECKOUT}/.build/checkouts/swift-nio/Sources/CNIOLinux/include', '-Xcc', '-fmodule-map-file={CHECKOUT}/.build/arm64-apple-macosx/debug/CNIODarwin.build/module.modulemap', '-Xcc', '-I', '-Xcc', '{CHECKOUT}/.build/checkouts/swift-nio/Sources/CNIODarwin/include', '-Xcc', '-fmodule-map-file={CHECKOUT}/.build/arm64-apple-macosx/debug/CNIOFreeBSD.build/module.modulemap', '-Xcc', '-I', '-Xcc', '{CHECKOUT}/.build/checkouts/swift-nio/Sources/CNIOFreeBSD/include', '-Xcc', '-fmodule-map-file={CHECKOUT}/.build/arm64-apple-macosx/debug/CNIOOpenBSD.build/module.modulemap', '-Xcc', '-I', '-Xcc', '{CHECKOUT}/.build/checkouts/swift-nio/Sources/CNIOOpenBSD/include', '-Xcc', '-fmodule-map-file={CHECKOUT}/.build/arm64-apple-macosx/debug/CNIOPosix.build/module.modulemap', '-Xcc', '-I', '-Xcc', '{CHECKOUT}/.build/checkouts/swift-nio/Sources/CNIOPosix/include', '-Xcc', '-fmodule-map-file={CHECKOUT}/.build/checkouts/swift-subprocess/Sources/_SubprocessCShims/include/module.modulemap', '-Xcc', '-I', '-Xcc', '{CHECKOUT}/.build/checkouts/swift-subprocess/Sources/_SubprocessCShims/include', '-module-cache-path', '{CHECKOUT}/.build/arm64-apple-macosx/debug/ModuleCache', '-parseable-output', '-parse-as-library', '-swift-version', '6', '-enable-upcoming-feature', 'NonisolatedNonsendingByDefault', '-enable-upcoming-feature', 'InferIsolatedConformances', '-plugin-path', '/Applications/Xcode_26.6.app/Contents/Developer/Toolchains/XcodeDefault.xctoolchain/usr/lib/swift/host/plugins/testing', '-sdk', '/Applications/Xcode_26.6.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX26.5.sdk', '-F', '/Applications/Xcode_26.6.app/Contents/Developer/Platforms/MacOSX.platform/Developer/Library/Frameworks', '-I', '/Applications/Xcode_26.6.app/Contents/Developer/Platforms/MacOSX.platform/Developer/usr/lib', '-L', '/Applications/Xcode_26.6.app/Contents/Developer/Platforms/MacOSX.platform/Developer/usr/lib', '-g', '-Xcc', '-isysroot', '-Xcc', '/Applications/Xcode_26.6.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX26.5.sdk', '-Xcc', '-F', '-Xcc', '/Applications/Xcode_26.6.app/Contents/Developer/Platforms/MacOSX.platform/Developer/Library/Frameworks', '-Xcc', '-fPIC', '-Xcc', '-g', '-package-name', 'b4app']
