name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Workflow and shell lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Install actionlint 1.7.12
        run: |
          set -euo pipefail
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/actionlint"
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: actionlint
        run: actionlint
      - name: shellcheck
        run: |
          shopt -s nullglob
          shellcheck .github/scripts/*.sh Hub/scripts/*.sh Infra/scripts/*.sh
      - name: Release tag guard test
        run: .github/scripts/test-tag-guard.sh

  package:
    name: Package build and tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Format lint
        run: swift format lint --strict --recursive Sources Tests Apps Package.swift
      - name: Cache the pinned PostgreSQL archive
        uses: actions/cache@v4
        with:
          path: .build/postgres-dl
          key: postgres-dl-${{ hashFiles('Scripts/fetch-postgres.sh') }}
      - name: Fetch PostgreSQL (the tests boot a private cluster from it)
        run: ./Scripts/fetch-postgres.sh
      - name: Build
        run: swift build
      - name: Test
        run: swift test

  apps:
    name: macOS and iOS app builds
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: ./Scripts/generate-project.sh
      - name: Cache SwiftPM (xcodebuild)
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-xcode-${{ runner.os }}-
      - name: Build macOS app
        run: >
          xcodebuild build -project B4App.xcodeproj -scheme B4App-macOS -destination 'platform=macOS'
          -clonedSourcePackagesDirPath .spm -derivedDataPath .build/DerivedData CODE_SIGNING_ALLOWED=NO
      - name: Build iOS app (simulator)
        run: >
          xcodebuild build -project B4App.xcodeproj -scheme B4App-iOS -destination 'generic/platform=iOS Simulator'
          -clonedSourcePackagesDirPath .spm -derivedDataPath .build/DerivedData CODE_SIGNING_ALLOWED=NO

  hub:
    name: Hub (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Hub
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests create a database per test, so they connect as the superuser.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust 1.93.1
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.93.1
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Hub/target
          key: hub-cargo-${{ runner.os }}-${{ hashFiles('Hub/Cargo.lock') }}
          restore-keys: hub-cargo-${{ runner.os }}-
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
