name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package build and tests
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Format lint
        run: swift format lint --strict --recursive Sources Tests Apps Package.swift
      - name: Cache the pinned PostgreSQL archive
        uses: actions/cache@v4
        with:
          path: .build/postgres-dl
          key: postgres-dl-${{ hashFiles('Scripts/fetch-postgres.sh') }}
      - name: Fetch PostgreSQL (the tests boot a private cluster from it)
        run: ./Scripts/fetch-postgres.sh
      - name: Build
        run: swift build
      - name: Test
        # TEMPORARY (M8b CI hang diagnosis): sample the test process if it outlives 18 minutes.
        run: |
          swift test > test.log 2>&1 &
          pid=$!
          for i in $(seq 1 108); do kill -0 $pid 2>/dev/null || break; sleep 10; done
          if kill -0 $pid 2>/dev/null; then
            echo "::group::hang: tests started but not finished"
            grep -o 'Test [A-Za-z0-9_]*(.*) started' test.log | sed 's/ started//' | sort > started.txt
            grep -oE 'Test [A-Za-z0-9_]*\(.*\) (passed|failed|skipped)' test.log | sed -E 's/ (passed|failed|skipped)$//' | sort -u > ended.txt
            comm -23 started.txt ended.txt | head -60
            grep -c 'passed after' test.log || true
            echo "::endgroup::"
            echo "::group::hang: postgres"
            ps -axo pid,etime,command | grep -E '[p]ostgres' | cut -c1-200
            for f in "$TMPDIR"/b4pg-shared-*/postgres.log; do tail -40 "$f"; done
            echo "::endgroup::"
            for p in $(pgrep -f 'b4appPackageTests'); do
              echo "::group::hang: sample $p"
              sample "$p" 3 -file "sample-$p.txt" >/dev/null 2>&1 || true
              grep -E 'Thread_|b4appPackageTests|psynch|semaphore|poll|kevent|mach_msg|SecItem|PQ' "sample-$p.txt" | sed -E 's/^[ +!:|]+//' | cut -c1-200 | head -400
              echo "::endgroup::"
            done
            tail -50 test.log
            kill $pid
            exit 1
          fi
          wait $pid; status=$?
          cat test.log
          exit $status

  apps:
    name: macOS and iOS app builds
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: ./Scripts/generate-project.sh
      - name: Cache SwiftPM (xcodebuild)
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-xcode-${{ runner.os }}-
      - name: Build macOS app
        run: >
          xcodebuild build -project B4App.xcodeproj -scheme B4App-macOS -destination 'platform=macOS'
          -clonedSourcePackagesDirPath .spm -derivedDataPath .build/DerivedData CODE_SIGNING_ALLOWED=NO
      - name: Build iOS app (simulator)
        run: >
          xcodebuild build -project B4App.xcodeproj -scheme B4App-iOS -destination 'generic/platform=iOS Simulator'
          -clonedSourcePackagesDirPath .spm -derivedDataPath .build/DerivedData CODE_SIGNING_ALLOWED=NO

  hub:
    name: Hub (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Hub
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests create a database per test, so they connect as the superuser.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust 1.93.1
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.93.1
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Hub/target
          key: hub-cargo-${{ runner.os }}-${{ hashFiles('Hub/Cargo.lock') }}
          restore-keys: hub-cargo-${{ runner.os }}-
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
