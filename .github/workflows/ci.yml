  # Temporary complete-aggregate comparison; required default and focused lanes stay unchanged.
  account-session-aggregate-serial-diagnostic:
    name: Account session aggregate serial diagnostic
    runs-on: macos-26
    timeout-minutes: 45
    needs: [scope, package]
    if: ${{ !cancelled() && github.event_name == 'pull_request' && github.event.pull_request.number == 180 && needs.scope.outputs.apple != 'false' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Provision finite system file-table headroom
        timeout-minutes: 1
        run: |
          set -euo pipefail
          sysctl kern.maxfiles kern.maxfilesperproc kern.num_files
          printf 'inherited_soft_nofile=%s\n' "$(ulimit -Sn)"
          printf 'inherited_hard_nofile=%s\n' "$(ulimit -Hn)"
          current_maxfiles=$(sysctl -n kern.maxfiles)
          [[ "$current_maxfiles" =~ ^[0-9]+$ ]]
          if (( 10#$current_maxfiles < 262144 )); then
            sudo -n sysctl -w kern.maxfiles=262144
          fi
          actual_maxfiles=$(sysctl -n kern.maxfiles)
          [[ "$actual_maxfiles" =~ ^[0-9]+$ ]]
          (( 10#$actual_maxfiles >= 262144 ))
          sysctl kern.maxfiles kern.maxfilesperproc kern.num_files
          printf 'inherited_soft_nofile=%s\n' "$(ulimit -Sn)"
          printf 'inherited_hard_nofile=%s\n' "$(ulimit -Hn)"
      - name: Record diagnostic source and toolchain
        run: |
          git log -1 --format='commit=%H%ntree=%T%nparents=%P'
          xcodebuild -version
          swift --version
          shasum -a 256 Package.swift Package.resolved .github/workflows/ci.yml Tests/CoordinatorTests/AccountSessionComparisonOwnerTests.swift Tests/WorkspaceStorageTests/AccountSessionComparisonTests.swift Scripts/check-owner-carrier-compiler-controls.py
      - name: Cache SwiftPM
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-
      - name: Cache the pinned PostgreSQL archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/postgres-dl
          key: postgres-dl-${{ hashFiles('Scripts/fetch-postgres.sh') }}
      - name: Fetch PostgreSQL (the tests boot a private cluster from it)
        run: ./Scripts/fetch-postgres.sh
      - name: Build
        run: swift build
      - name: Start the tests' PostgreSQL
        env:
          B4APP_TEST_POSTGRES_DIR: ${{ runner.temp }}/pg
        run: swift test --filter 'AccountRegistryTests/aLedgerIsCreatedOnlyWhenMissing'
      - name: Complete storage and coordinator aggregate without cross-test parallelism
        timeout-minutes: 35
        shell: bash
        env:
          B4APP_TEST_POSTGRES_DIR: ${{ runner.temp }}/pg
        run: swift test --skip-build --no-parallel --filter '^(WorkspaceStorageTests|CoordinatorTests)\.' 2>&1 | tee "$RUNNER_TEMP/account-session-aggregate-serial-diagnostic.log"
      - name: Save diagnostic aggregate output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: account-session-aggregate-serial-diagnostic
          path: ${{ runner.temp }}/account-session-aggregate-serial-diagnostic.log
          if-no-files-found: warn
          retention-days: 7

  # The debug iOS and macOS app builds, in one DerivedData, beside the test jobs. The beta builds
  # differ only in Config/Flavor-beta.xcconfig and are built at release, not here (D-244).
  app-builds:
    name: App builds
    runs-on: macos-26
    timeout-minutes: 30
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.apple != 'false' }}
    outputs:
      ios-app: ${{ steps.ios-app.outcome }}
      macos-app: ${{ steps.macos-app.outcome }}
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Cache SwiftPM (xcodebuild)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .spm
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-xcode-${{ runner.os }}-
      - name: File times from content
        run: python3 Scripts/restore_mtimes.py
      - name: Restore DerivedData
        if: github.event_name != 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/AppDerivedData/Build
            .build/AppDerivedData/ModuleCache.noindex
          key: dd-apps-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: dd-apps-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.resolved') }}-
      - name: Generate project
        run: ./Scripts/generate-project.sh
      - name: Build iOS app (simulator)
        id: ios-app
        run: >
          xcodebuild build -project B4App.xcodeproj -scheme B4App-iOS -destination 'generic/platform=iOS Simulator'
          -clonedSourcePackagesDirPath .spm -derivedDataPath .build/AppDerivedData CODE_SIGNING_ALLOWED=NO -showBuildTimingSummary
      - name: Build macOS app
        id: macos-app
        if: ${{ !cancelled() }}
        run: >
          xcodebuild build -project B4App.xcodeproj -scheme B4App-macOS -destination 'platform=macOS'
          -clonedSourcePackagesDirPath .spm -derivedDataPath .build/AppDerivedData CODE_SIGNING_ALLOWED=NO -showBuildTimingSummary
      - name: Save DerivedData
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/AppDerivedData/Build
            .build/AppDerivedData/ModuleCache.noindex
          key: dd-apps-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.resolved') }}-${{ github.sha }}

  # The required check for the two app builds. It always runs and reads the build steps' own
  # outcomes: a build that failed, was cancelled or never ran fails it, and the one skip it accepts is
  # the scope job's explicit "false".
  apps:
    name: macOS and iOS app builds
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [scope, app-builds]
    if: always()
    permissions: {}
    steps:
      - name: Every app build passed
        env:
          APPLE: ${{ needs.scope.outputs.apple }}
          JOBS: ${{ needs.app-builds.result }}
          IOS: ${{ needs.app-builds.outputs.ios-app }}
          MACOS: ${{ needs.app-builds.outputs.macos-app }}
        run: |
          echo "scope: apple=$APPLE; job: $JOBS; iOS build: $IOS; macOS build: $MACOS"
          if [ "$APPLE" = false ] && [ "$JOBS" = skipped ]; then
            echo "This change touches nothing the apps are built from."
            exit 0
          fi
          test "$IOS" = success
          test "$MACOS" = success

  # The fixture app builds from the package, not from the app builds, so it runs beside them.
  # "ios-layout-result" below reports it under the name the branch protection requires.
  ios-layout:
    name: iOS layout tests
    runs-on: macos-26
    timeout-minutes: 30
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.apple != 'false' }}
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Cache SwiftPM (xcodebuild)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .spm
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-xcode-${{ runner.os }}-
      - name: File times from content
        run: python3 Scripts/restore_mtimes.py
      - name: Restore DerivedData
        if: github.event_name != 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/DerivedData/Build
            .build/DerivedData/ModuleCache.noindex
          key: dd-ios-layout-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: dd-ios-layout-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.resolved') }}-
      - name: Begin iOS Simulator boot
        id: simulator
        # The listing may take 5 minutes on a cold runner and the boot call 1.
        timeout-minutes: 7
        run: python3 Scripts/prepare_ios_layout_simulator.py --github-output "$GITHUB_OUTPUT"
      # Builds while the Simulator boots, for no device, so it never waits on the boot; the boot and
      # the build each take two to three minutes on a hosted runner.
      - name: Build the layout tests
        env:
          B4APP_LAYOUT_DERIVED_DATA: .build/DerivedData
        run: ./Scripts/test-ios-layout.sh --build-only -clonedSourcePackagesDirPath .spm
      - name: iOS navigation and banner regression tests
        env:
          B4APP_LAYOUT_SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          B4APP_LAYOUT_DESTINATION: ${{ steps.simulator.outputs.destination }}
          B4APP_LAYOUT_DERIVED_DATA: .build/DerivedData
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$B4APP_LAYOUT_SIMULATOR_UDID" -b
          ./Scripts/test-ios-layout.sh --without-building -clonedSourcePackagesDirPath .spm
      - name: Save iOS layout screenshots and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-layout-results
          path: .build/iOSLayout/Results-*.xcresult
          retention-days: 7
      - name: Save DerivedData
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build/DerivedData/Build
            .build/DerivedData/ModuleCache.noindex
          key: dd-ios-layout-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.resolved') }}-${{ github.sha }}

  # The required check. It always runs, so a cancelled or skipped layout job fails it instead of
  # leaving it skipped, which the branch protection would take for a pass. The one skip it accepts is
  # the scope job's: a change that touches nothing these tests read.
  ios-layout-result:
    name: iOS navigation and banner regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [scope, ios-layout]
    if: always()
    permissions: {}
    steps:
      - name: The layout job passed
        env:
          APPLE: ${{ needs.scope.outputs.apple }}
          LAYOUT: ${{ needs.ios-layout.result }}
        run: |
          echo "scope: apple=$APPLE; iOS layout job: $LAYOUT"
          if [ "$APPLE" = false ] && [ "$LAYOUT" = skipped ]; then
            echo "This change touches nothing the layout tests read."
            exit 0
          fi
          test "$LAYOUT" = success

  macos-smoke:
