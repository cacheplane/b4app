              IDENTITY_NOTES = ("change 'let' to 'var' to make it mutable", "'identity' declared here")

              # Closed public observation alphabet; never extends diagnostic acceptance.
              NOTE_LEXEMES = {'Coordinator': 1, 'HubSync': 2, 'ConfiguredClientOrigin': 3, 'Foundation': 4, 'WorkspaceStorage': 5, 'WorkspaceSecrets': 6, 'WorkspaceDatabase': 7, 'URL': 8, 'SecretRef': 9, 'SecretStore': 10, 'APIFactory': 11, 'HubAPI': 12, 'UUID': 13, 'Sendable': 14, 'hub': 15, 'database': 16, 'baseURL': 17, 'reference': 18, 'store': 19, 'makeAPI': 20, 'identity': 21, 'hubIdentity': 22, 'api': 23, 'init': 24, 'deinit': 25, 'final': 26, 'class': 27, 'struct': 28, 'enum': 29, 'let': 30, 'var': 31, 'private': 32, 'fileprivate': 33, 'internal': 34, 'public': 35, 'any': 36, 'func': 37, 'unchecked': 38, 'escaping': 39, 'Swift': 40, 'WorkspaceSync': 41, 'String': 42, 'async': 43, 'throws': 44, 'ObjectIdentifier': 45, 'FoundationEssentials': 46, 'Synchronization': 47, 'Mutex': 48, 'nonisolated': 49, 'get': 50}
              NOTE_PUNCTUATION = {'.': 101, ':': 102, ',': 103, '(': 104, ')': 105, '{': 106, '}': 107, '<': 108, '>': 109, '@': 110, '?': 111, '&': 112, '=': 113, '->': 114, "'": 115}
              NOTE_FILES = {'Coordinator.HubSync': 'virtual_hubsync', 'Coordinator.HubSync (fileprivate)': 'virtual_hubsync_fileprivate', 'Coordinator.HubSync (internal)': 'virtual_hubsync_internal', 'Coordinator.HubSync.ConfiguredClientOrigin': 'virtual_hubsync_configured_client_origin', 'Coordinator.HubSync.ConfiguredClientOrigin (fileprivate)': 'virtual_hubsync_configured_client_origin_fileprivate', 'Coordinator.HubSync.ConfiguredClientOrigin (internal)': 'virtual_hubsync_configured_client_origin_internal'}

              def declaration_note_observation(header, context_lines, note_path, note_line, note_columns, note_messages):
                  global DECLARATION_NOTE_OBSERVATION
                  file_name, line_text, col_text, severity, message = header
                  base = {"ordinal": 2, "block": 2, "stage": "declaration_note",
                          "path_expected": file_name == note_path, "line_expected": int(line_text) == note_line,
                          "column_expected": int(col_text) in note_columns, "severity_expected": severity == "note",
                          "message_expected": message in note_messages, "severity": severity,
                          "known_note_complete": False, "cause": "observer_failure"}
                  DECLARATION_NOTE_OBSERVATION = base
                  try:
                      file_id = "checkout_hubsync_source" if file_name == note_path else NOTE_FILES.get(file_name)
                      require(file_id is not None, "unknown_file")
                      member = re.fullmatch(r"'((?:Coordinator\.)?(?:HubSync\.)?(?:ConfiguredClientOrigin\.)?init\(hub:database:baseURL:reference:store:makeAPI:\))' declared here", message)
                      require(member is not None, "unknown_message")
                      line_number, column = int(line_text), int(col_text)
                      require(1 <= line_number <= 256 and 1 <= column <= 256, "location_bound")
                      require(len(context_lines) <= 12, "observation_bound")
                      runs = 32  # Conservative header and fixed renderer overhead.

                      def charge(count):
                          nonlocal runs
                          runs += count
                          require(runs <= 512, "observation_bound")

                      def tokens(value):
                          result = []
                          for atom in re.findall(r" +|[A-Za-z_][A-Za-z_0-9]*|->|.", value):
                              charge(1)
                              if atom.startswith(" "):
                                  require(len(atom) <= 256, "observation_bound")
                                  result.append([0, len(atom)])
                              else:
                                  token_id = NOTE_LEXEMES.get(atom, NOTE_PUNCTUATION.get(atom))
                                  require(token_id is not None and token_id != 115, "unknown_context_lexeme")
                                  result.append([token_id, 1])
                          return result

                      member_runs = tokens(member[1])
                      message_id = ({"kind": "init_note"} if message == INIT_NOTE else
                                    {"kind": "member_declared_here", "runs": member_runs})
                      rows = []
                      for rendered in context_lines:
                          if rendered == "":
                              charge(1)
                              rows.append({"kind": "blank"})
                              continue
                          source_row = re.fullmatch(r"( {0,255})([1-9][0-9]{0,2}) \| (.*)", rendered)
                          if source_row:
                              spaces, number_text, value = source_row.groups()
                              number = int(number_text)
                              require(1 <= number <= 256 and len(spaces) + len(number_text) <= 256, "location_bound")
                              charge(12)
                              rows.append({"kind": "source", "gutter_spaces": len(spaces), "line": number,
                                           "delimiter": "space_bar_space", "runs": tokens(value)})
                              continue
                          annotation = re.fullmatch(r"( {1,256})\| ( {0,256})`- (error|note|warning): (.+)", rendered)
                          require(annotation is not None, "unknown_renderer")
                          gutter, indent, annotation_severity, annotation_message = annotation.groups()
                          require(annotation_severity == severity and annotation_message == message, "unknown_renderer")
                          charge(32 + len(member_runs))
                          rows.append({"kind": "annotation", "gutter_spaces": len(gutter), "column_spaces": len(indent),
                                       "delimiter": "bar_space", "marker": "backtick_dash_space", "message": "header"})
                      complete = {**base, "known_note_complete": True, "cause": "complete", "file": file_id,
                                  "line": line_number, "column": column, "message": message_id, "rows": rows}
                      encoded = json.dumps({"category": "owner_carrier_declaration_note_observation", **complete}, sort_keys=True)
                      require(len(encoded.encode("ascii")) + 1 <= 8192, "observation_bound")
                      DECLARATION_NOTE_OBSERVATION = complete
                  except Failure as failure:
                      base["cause"] = failure.code
                  except BaseException:
                      pass

              def diagnostics(data, ordinal, path, fixture, checkout):
                  if ordinal == 1:
                      require(not data, "positive_output")
                      return 0, 0, 0
                  try:
                      text = data.decode("ascii")
                  except UnicodeError:
                      raise Failure("diagnostic_decode") from None
                  require(not any((ord(c) < 32 and c != "\n") or 127 <= ord(c) <= 159 for c in text), "diagnostic_control")
                  source = {index + 1: value for index, value in enumerate(fixture.split("\n"))}
                  error_line = 3 if ordinal == 2 else 4
                  target = source[error_line]
                  columns = ({target.index("HubSync") + 1, target.index("ConfiguredClientOrigin") + 1, target.index("init(") + 1}
                             if ordinal == 2 else {target.index("original") + 1, target.index("identity") + 1})
                  messages = INIT_MESSAGES if ordinal == 2 else (IDENTITY_MESSAGE,)
                  note_path = str(checkout / "Sources/Coordinator/HubSync/HubSync.swift")
                  note_line = 57 if ordinal == 2 else 49
                  note_columns = {17} if ordinal == 2 else {5, 9}
                  note_messages = (INIT_NOTE,) if ordinal == 2 else IDENTITY_NOTES
                  note_context = {line: value for line, value in DECLARATION_LINES.items()
                                  if (55 <= line <= 61 if ordinal == 2 else 47 <= line <= 51)}
                  raw_lines = text.splitlines()
                  require(len(raw_lines) <= 24 and raw_lines.count("") <= 4, "diagnostic_line_bound")
                  blocks = []
                  for line in raw_lines:
                      match = re.fullmatch(r"(.+):([1-9][0-9]*):([1-9][0-9]*): (error|note|warning): (.+)", line)
                      if match:
                          blocks.append((match.groups(), []))
                      else:
                          require(bool(blocks), "diagnostic_header")
                          blocks[-1][1].append(line)
                  require(1 <= len(blocks) <= 2, "diagnostic_block_count")
                  for index, (header, context_lines) in enumerate(blocks):
                      file_name, line_text, col_text, severity, message = header
                      line_number, column = int(line_text), int(col_text)
                      if index == 0:
                          require(file_name == str(path) and line_number == error_line and column in columns
                                  and severity == "error" and message in messages, "intended_error")
                          allowed, width = source, 1
                      else:
                          try:
                              require(file_name == note_path and line_number == note_line and column in note_columns
                                      and severity == "note" and message in note_messages, "declaration_note")
                          except Failure:
                              if ordinal == 2:
                                  try:
                                      declaration_note_observation(header, context_lines, note_path, note_line, note_columns, note_messages)
                                  except BaseException:
                                      pass
                              raise
                          allowed, width = note_context, 2
                      seen = []
                      annotations = 0
                      for rendered in context_lines:
                          if rendered == "":
                              continue
                          annotation = " " * (width + 1) + "| " + " " * (column - 1) + "`- " + severity + ": " + message
                          if rendered == annotation:
                              require(bool(seen) and seen[-1] == line_number and annotations == 0, "diagnostic_annotation")
                              annotations += 1
                              continue
                          match = re.fullmatch(r"([ 0-9]{1,2}) \| (.*)", rendered)
                          require(match is not None, "diagnostic_context_form")
                          number_text, value = match.groups()
                          number = int(number_text)
                          require(number in allowed and value == allowed[number]
                                  and rendered == f"{number:>{width}} | {allowed[number]}", "diagnostic_context_text")
                          require(not seen or number == seen[-1] + 1, "diagnostic_context_order")
                          seen.append(number)
                      require(line_number in seen and annotations == 1, "diagnostic_context_missing")
                  return error_line, int(blocks[0][0][2]), len(blocks) - 1

              def run_control(ordinal, control, checkout, child_env):
                  path, fixture, argv, fixture_hash = control
                  require(not CANCELLED and time.monotonic() + 22.0 <= PARENT_END, "launch_budget")
                  owner = Owner(ordinal)
                  OWNERS.append(owner)
                  deadline = time.monotonic() + 12.0
                  try:
                      owner.process = subprocess.Popen(argv, cwd=checkout, env=child_env, stdin=subprocess.DEVNULL,
                                                       stdout=subprocess.PIPE, stderr=subprocess.STDOUT, bufsize=0,
                                                       shell=False, close_fds=True, start_new_session=True)
                  except BaseException:
                      raise Failure("launch_failure") from None
                  require(type(owner.process.pid) is int and owner.process.pid > 0, "owned_pid_shape")
                  owner.valid = True
                  try:
                      os.set_blocking(owner.process.stdout.fileno(), False)
                  except BaseException:
                      close_capture(owner)
                      raise Failure("capture_setup") from None
                  selector = selectors.DefaultSelector()
                  try:
                      selector.register(owner.process.stdout, selectors.EVENT_READ)
                      registered = True
                      while True:
                          require(not CANCELLED, "cancelled")
                          require(time.monotonic() < deadline, "normal_deadline")
                          drain(owner)
                          if owner.eof and registered:
                              selector.unregister(owner.process.stdout)
                              registered = False
                          terminal = observe(owner)
                          if terminal is not None:
                              require(terminal[0] == os.CLD_EXITED, "child_signal")
                              require(terminal[1] == (0 if ordinal == 1 else 1), "child_exit_status")
                              if owner.eof:
                                  break
                          selector.select(timeout=max(0.0, min(0.02, deadline - time.monotonic())))
                      require(owner.terminal[0] == os.CLD_EXITED, "child_signal")
                      require(owner.terminal[1] == (0 if ordinal == 1 else 1), "child_exit_status")
                      reap(owner, deadline)
                      line, column, notes = diagnostics(bytes(owner.data), ordinal, path, fixture, checkout)
                      require(not CANCELLED and time.monotonic() < deadline, "normal_deadline")
                      emit("owner_carrier_control_qualified", ordinal=ordinal, raw_exit_status=0 if ordinal == 1 else 1,
                           fixture_sha256=fixture_hash, vector_sha256=hashlib.sha256(json.dumps(argv, separators=(",", ":")).encode()).hexdigest(),
                           output_sha256=hashlib.sha256(owner.data).hexdigest(), captured_bytes=len(owner.data),
                           diagnostic_errors=0 if ordinal == 1 else 1, diagnostic_notes=notes,
                           line=line, column=column, direct_reaped=True, normal_driver_job_completion_trusted=True,
                           descendant_quiescence_proven=False)
                  finally:
                      selector.close()
                  require(not CANCELLED and time.monotonic() < deadline, "normal_deadline")

              def main():
                  checkout, child_env, controls = prepare()
                  for ordinal, control in enumerate(controls, 1):
                      run_control(ordinal, control, checkout, child_env)
                  require(not CANCELLED and time.monotonic() < PARENT_END - 3.0, "parent_budget")

              result = 1
              reason = "infrastructure_failure"
              cleanup_receipts = []
              try:
                  main()
                  result = 0
              except Failure as failure:
                  reason = failure.code
              except BaseException:
                  reason = "infrastructure_failure"
              if result:
                  for owner in OWNERS:
                      if owner.process is not None and not owner.reaped:
                          cleanup_receipts.append(failed_cleanup(owner))
              for owner in OWNERS:
                  try:
                      close_capture(owner)
                  except BaseException:
                      result = 1
                      reason = "descriptor_close_failure"
              require(time.monotonic() < PARENT_END, "parent_budget")
              for receipt in cleanup_receipts:
                  emit("owner_carrier_failed_cleanup", **receipt)
              if result:
                  if DECLARATION_NOTE_OBSERVATION is not None:
                      try:
                          emit("owner_carrier_declaration_note_observation", **DECLARATION_NOTE_OBSERVATION)
                      except BaseException:
                          pass
                  emit("owner_carrier_compiler_controls_failed", reason=reason, compiler_controls_qualified=False,
                       descendant_quiescence_proven=False)
              else:
                  require(not CANCELLED, "cancelled")
                  emit("owner_carrier_compiler_controls_qualified", controls=3,
                       normal_driver_job_completion_trusted=True, descendant_quiescence_proven=False)
              sys.stdout.flush()
              sys.stderr.flush()
              if result == 0:
                  require(not CANCELLED, "cancelled")
                  require(time.monotonic() < PARENT_END, "parent_budget")
              os._exit(result)

          except BaseException:
              for retained in globals().get("OWNERS", []):
                  try:
                      if retained.process is not None and not retained.reaped:
                          failed_cleanup(retained)
                  except BaseException:
                      pass
                  try:
                      close_capture(retained)
                  except BaseException:
                      pass
              try:
                  print('{"category":"owner_carrier_infrastructure_failure"}', flush=True)
                  if "sys" in globals():
                      sys.stdout.flush()
                      sys.stderr.flush()
              finally:
                  if "os" in globals():
                      os._exit(1)
                  raise SystemExit(1)
          PY

  apps:
    name: macOS and iOS app builds
    runs-on: macos-26
    # With the layout job's 40 this keeps the 60 minutes the two shared as one job.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: ./Scripts/generate-project.sh
      - name: Cache SwiftPM (xcodebuild)
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-xcode-${{ runner.os }}-
      - name: Build macOS app
        run: >
          xcodebuild build -project B4App.xcodeproj -scheme B4App-macOS -destination 'platform=macOS'
          -clonedSourcePackagesDirPath .spm -derivedDataPath .build/DerivedData CODE_SIGNING_ALLOWED=NO -showBuildTimingSummary
      - name: Build iOS app (simulator)
        run: >
          xcodebuild build -project B4App.xcodeproj -scheme B4App-iOS -destination 'generic/platform=iOS Simulator'
          -clonedSourcePackagesDirPath .spm -derivedDataPath .build/DerivedData CODE_SIGNING_ALLOWED=NO -showBuildTimingSummary
      - name: Build macOS app (beta)
        run: >
          xcodebuild build -project B4App.xcodeproj -scheme B4App-macOS-Beta -destination 'platform=macOS'
          -clonedSourcePackagesDirPath .spm -derivedDataPath .build/DerivedData CODE_SIGNING_ALLOWED=NO -showBuildTimingSummary
      - name: Build iOS app (beta, simulator)
        run: >
          xcodebuild build -project B4App.xcodeproj -scheme B4App-iOS-Beta -destination 'generic/platform=iOS Simulator'
          -clonedSourcePackagesDirPath .spm -derivedDataPath .build/DerivedData CODE_SIGNING_ALLOWED=NO -showBuildTimingSummary

  # The fixture app builds from the package, not from the four app builds, so it runs beside them.
  ios-layout:
    name: iOS navigation and banner regression tests
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Cache SwiftPM (xcodebuild)
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-xcode-${{ runner.os }}-
      - name: Begin iOS Simulator boot
        id: simulator
        # The listing may take 5 minutes on a cold runner and the boot call 1.
        timeout-minutes: 7
        run: python3 Scripts/prepare_ios_layout_simulator.py --github-output "$GITHUB_OUTPUT"
      - name: iOS navigation and banner regression tests
        env:
          B4APP_LAYOUT_SIMULATOR_UDID: ${{ steps.simulator.outputs.udid }}
          B4APP_LAYOUT_DESTINATION: ${{ steps.simulator.outputs.destination }}
          B4APP_LAYOUT_DERIVED_DATA: .build/DerivedData
          B4APP_LAYOUT_EXPECTED_UI_TESTS: "13"
          B4APP_LAYOUT_EXPECTED_COMPONENT_TESTS: "3"
          B4APP_LAYOUT_FOCUSED_COVERAGE: "0"
        run: |
          set -euo pipefail
          xcrun simctl bootstatus "$B4APP_LAYOUT_SIMULATOR_UDID" -b
          ./Scripts/test-ios-layout.sh -clonedSourcePackagesDirPath .spm
      - name: Save iOS layout screenshots and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ios-layout-results
          path: .build/iOSLayout/Results-*.xcresult
          retention-days: 7

  macos-smoke:
    name: macOS recovery smoke tests
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Set up Node.js 24.20.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.20.0
          cache: npm
          cache-dependency-path: Tests/B4Runtime/package-lock.json
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Cache SwiftPM (xcodebuild)
        uses: actions/cache@v4
        with:
          path: .spm
          key: spm-xcode-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
          restore-keys: spm-xcode-${{ runner.os }}-
      - name: Cache the pinned PostgreSQL archive
        uses: actions/cache@v4
        with:
          path: .build/postgres-dl
          key: postgres-dl-${{ hashFiles('Scripts/fetch-postgres.sh') }}
      - name: macOS recovery smoke tests
        # The virtual desktop is 1024 points wide; keep both journeys fully on-screen.
        run: ./Scripts/test-macos-smoke.sh B4APP_SMOKE_DESKTOP_WIDTH=1000 -clonedSourcePackagesDirPath .spm
      - name: Save macOS screenshots and test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos-smoke-results
          path: .build/macOSSmoke/Results-*.xcresult
          retention-days: 7

  hub:
    name: Hub (Rust)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: Hub
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # The tests create a database per test, so they connect as the superuser.
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust 1.93.1
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component rustfmt --component clippy
          rustup default 1.93.1
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Hub/target
          key: hub-cargo-${{ runner.os }}-${{ hashFiles('Hub/Cargo.lock') }}
          restore-keys: hub-cargo-${{ runner.os }}-
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
