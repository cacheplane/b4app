        id: account-session-fileprivate-contexts-controls
        if: ${{ !cancelled() && steps.package-build.outcome == 'success' && steps.test-postgres-prewarm.outcome == 'success' && steps.socket-ownership-controls.outcome == 'success' && steps.owner-carrier-metadata.outcome == 'success' && steps.owner-carrier-origin-controls.outcome == 'success' && steps.owner-carrier-receipt-controls.outcome == 'success' && steps.account-session-decoder-boundary-controls.outcome == 'success' }}
        timeout-minutes: 1
        env:
          OWNER_CARRIER_METADATA_SAMPLE: ${{ steps.owner-carrier-metadata.outputs.sample-path }}
        run: |
          python3 -I - p2b-fileprivate-contexts <<'PY'
          try:
              import time
              START = time.monotonic()
              PARENT_END = START + 50.0
              import hashlib
              import os
              from pathlib import Path
              import stat
              import sys
              if len(sys.argv) != 2 or sys.argv[0] != "-" or sys.argv[1] != 'p2b-fileprivate-contexts':
                  raise ValueError()
              checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
              if not checkout.is_dir():
                  raise ValueError()
              relative = "Scripts/check-owner-carrier-compiler-controls.py"
              helper_path = (checkout / relative).resolve(strict=True)
              if helper_path != checkout / relative or not helper_path.is_relative_to(checkout):
                  raise ValueError()
              cap = 262144
              expected = "36c67bbb716cde6145f0e1b8a1bc68ccb79daecf57775b3b8ac52c3ec836d251"
              fd = os.open(helper_path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(fd, "rb") as stream:
                  before = os.fstat(stream.fileno())
                  if not stat.S_ISREG(before.st_mode) or not 0 < before.st_size <= cap:
                      raise ValueError()
                  helper_bytes = stream.read(cap + 1)
                  after = os.fstat(stream.fileno())
                  if len(helper_bytes) != before.st_size or len(helper_bytes) > cap:
                      raise ValueError()
                  if (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns) != (
                          after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns):
                      raise ValueError()
              if hashlib.sha256(helper_bytes).hexdigest() != expected or time.monotonic() > START + 4.0:
                  raise ValueError()
              namespace = {"__name__": "__main__", "__file__": str(helper_path),
                           "BOOTSTRAP_START": START, "BOOTSTRAP_PARENT_END": PARENT_END,
                           "BOOTSTRAP_HELPER_RELATIVE": relative, "BOOTSTRAP_HELPER_SHA256": expected,
                           "BOOTSTRAP_HELPER_BYTES": len(helper_bytes)}
              exec(compile(helper_bytes, str(helper_path), "exec"), namespace, namespace)
          except BaseException:
              print('{"category":"owner_carrier_infrastructure_failure"}', flush=True)
              raise SystemExit(1)
          PY
      - name: Focused account session comparison regressions
        id: account-session-comparison-controls
        if: ${{ !cancelled() && steps.package-build.outcome == 'success' && steps.test-postgres-prewarm.outcome == 'success' && steps.socket-ownership-controls.outcome == 'success' && steps.owner-carrier-metadata.outcome == 'success' && steps.owner-carrier-origin-controls.outcome == 'success' && steps.owner-carrier-receipt-controls.outcome == 'success' && steps.account-session-package-controls.outcome == 'success' && steps.account-session-storage-fields-controls.outcome == 'success' && steps.account-session-coordinator-controls.outcome == 'success' && steps.account-session-check-boundary-controls.outcome == 'success' && steps.account-session-probe-boundary-controls.outcome == 'success' && steps.account-session-reference-receipt-controls.outcome == 'success' && steps.account-session-presence-authority-controls.outcome == 'success' && steps.account-session-decoder-boundary-controls.outcome == 'success' && steps.account-session-fileprivate-contexts-controls.outcome == 'success' }}
        env:
          B4APP_TEST_POSTGRES_DIR: ${{ runner.temp }}/pg
        run: swift test --skip-build --filter 'AccountSessionComparisonTests|AccountSessionComparisonOwnerTests'
      - name: Historical action admission regressions
        id: historical-action-controls
        if: ${{ !cancelled() && steps.package-build.outcome == 'success' && steps.test-postgres-prewarm.outcome == 'success' }}
        run: swift test --skip-build --filter AgentProtocolHistoricalActionTests
      - name: Focused Agent Protocol foundation regressions
        if: ${{ !cancelled() && steps.package-build.outcome == 'success' && steps.test-postgres-prewarm.outcome == 'success' }}
        run: swift test --skip-build --filter 'AgentProtocol|ProtocolProjectionStoreTests|ProtocolActivation'
      - name: Focused Node probe observation controls
        id: node-probe-control
        if: ${{ !cancelled() && steps.package-build.outcome == 'success' && steps.test-postgres-prewarm.outcome == 'success' }}
        run: swift test --skip-build --filter NodeVersionProbeObservationTests
      - name: Focused owned protocol proof writer regressions
        if: ${{ !cancelled() && steps.package-build.outcome == 'success' && steps.socket-ownership-controls.outcome == 'success' && steps.owner-carrier-metadata.outcome == 'success' && steps.owner-carrier-origin-controls.outcome == 'success' && steps.owner-carrier-receipt-controls.outcome == 'success' }}
        run: swift test --skip-build --experimental-maximum-parallelization-width 2 --filter OwnedProtocolProofWriteTests
      - name: Focused scope owner publication regressions
        id: scope-owner-publication-controls
        if: ${{ !cancelled() && steps.package-build.outcome == 'success' && steps.socket-ownership-controls.outcome == 'success' && steps.owner-carrier-metadata.outcome == 'success' && steps.owner-carrier-origin-controls.outcome == 'success' && steps.owner-carrier-receipt-controls.outcome == 'success' }}
        env:
          B4APP_TEST_POSTGRES_DIR: ${{ runner.temp }}/pg
        run: swift test --skip-build --filter ScopeOwnerPublicationTests

  bounded-database-aggregate:
    name: Bounded database aggregate
    runs-on: macos-26
    timeout-minutes: 45
    needs: verify-checkout
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Provision finite system file-table headroom
        timeout-minutes: 1
        run: |
          set -euo pipefail
          sysctl kern.maxfiles kern.maxfilesperproc kern.num_files
          printf 'inherited_soft_nofile=%s\n' "$(ulimit -Sn)"
          printf 'inherited_hard_nofile=%s\n' "$(ulimit -Hn)"
          current_maxfiles=$(sysctl -n kern.maxfiles)
          [[ "$current_maxfiles" =~ ^[0-9]+$ ]]
          if (( 10#$current_maxfiles < 262144 )); then
            sudo -n sysctl -w kern.maxfiles=262144
          fi
          actual_maxfiles=$(sysctl -n kern.maxfiles)
          [[ "$actual_maxfiles" =~ ^[0-9]+$ ]]
          (( 10#$actual_maxfiles >= 262144 ))
          sysctl kern.maxfiles kern.maxfilesperproc kern.num_files
          printf 'inherited_soft_nofile=%s\n' "$(ulimit -Sn)"
          printf 'inherited_hard_nofile=%s\n' "$(ulimit -Hn)"
      - name: Record diagnostic source and toolchain
        run: |
          git log -1 --format='commit=%H%ntree=%T%nparents=%P'
          xcodebuild -version
          swift --version
          shasum -a 256 Package.swift Package.resolved .github/workflows/pr-180-qualification.yml Tests/CoordinatorTests/AccountSessionComparisonOwnerTests.swift Tests/WorkspaceStorageTests/AccountSessionComparisonTests.swift Scripts/check-owner-carrier-compiler-controls.py
      - name: File times from content
        run: python3 Scripts/restore_mtimes.py
      - name: Restore the SwiftPM build
        if: github.event_name != 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-v2-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: spm-v2-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.resolved') }}-
      - name: Cache the pinned PostgreSQL archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/postgres-dl
          key: postgres-dl-${{ hashFiles('Scripts/fetch-postgres.sh') }}
      - name: Fetch PostgreSQL (the tests boot a private cluster from it)
        run: ./Scripts/fetch-postgres.sh
      - name: Build
        run: swift build
      - name: Start the tests' PostgreSQL
        env:
          B4APP_TEST_POSTGRES_DIR: ${{ runner.temp }}/pg
        run: swift test --filter 'AccountRegistryTests/aLedgerIsCreatedOnlyWhenMissing'
      - name: Complete storage and coordinator aggregate at width two
        timeout-minutes: 35
        shell: bash
        env:
          B4APP_TEST_POSTGRES_DIR: ${{ runner.temp }}/pg
        run: swift test --skip-build --experimental-maximum-parallelization-width 2 --filter '^(WorkspaceStorageTests|CoordinatorTests)\.' 2>&1 | tee "$RUNNER_TEMP/bounded-database-aggregate.log"
      - name: Save diagnostic aggregate output
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bounded-database-aggregate
          path: ${{ runner.temp }}/bounded-database-aggregate.log
          if-no-files-found: error
          retention-days: 7

