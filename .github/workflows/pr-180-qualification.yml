name: PR 180 protocol qualification

on:
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

env:
  B4APP_PROTOCOL_FULL_MATRIX: "1"

jobs:
  verify-checkout:
    name: Verify PR 180 checkout
    if: >-
      github.repository == 'cacheplane/b4app' &&
      github.event.label.name == 'qualify-pr-180' &&
      github.event.pull_request.number == 180 &&
      github.event.pull_request.head.repo.full_name == 'cacheplane/b4app' &&
      github.event.pull_request.head.ref == 'blove/protocol-client-foundation-f9a-20261111'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify merge parents against the labeled pull request
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/pull/180/merge
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mapfile -t parents < <(git cat-file -p HEAD | sed -n '/^$/q; s/^parent //p')
          test "${#parents[@]}" = 2
          test "${parents[0]}" = "$BASE_SHA"
          test "${parents[1]}" = "$HEAD_SHA"
          printf 'merge=%s base=%s head=%s\n' "$GITHUB_SHA" "$BASE_SHA" "$HEAD_SHA"

  package:
    name: Protocol controls and focused tests
    runs-on: macos-26
    timeout-minutes: 45
    needs: verify-checkout
    steps:
      - uses: actions/checkout@v5
      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app
      - name: Provision finite system file-table headroom
        timeout-minutes: 1
        run: |
          set -euo pipefail
          sysctl kern.maxfiles kern.maxfilesperproc kern.num_files
          printf 'inherited_soft_nofile=%s\n' "$(ulimit -Sn)"
          printf 'inherited_hard_nofile=%s\n' "$(ulimit -Hn)"
          current_maxfiles=$(sysctl -n kern.maxfiles)
          [[ "$current_maxfiles" =~ ^[0-9]+$ ]]
          if (( 10#$current_maxfiles < 262144 )); then
            sudo -n sysctl -w kern.maxfiles=262144
          fi
          actual_maxfiles=$(sysctl -n kern.maxfiles)
          [[ "$actual_maxfiles" =~ ^[0-9]+$ ]]
          (( 10#$actual_maxfiles >= 262144 ))
          sysctl kern.maxfiles kern.maxfilesperproc kern.num_files
          printf 'inherited_soft_nofile=%s\n' "$(ulimit -Sn)"
          printf 'inherited_hard_nofile=%s\n' "$(ulimit -Hn)"
      - name: File times from content
        run: python3 Scripts/restore_mtimes.py
      - name: Restore the SwiftPM build
        if: github.event_name != 'push'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-v2-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: spm-v2-${{ runner.os }}-xcode26.6-${{ hashFiles('Package.resolved') }}-
      - name: Cache the pinned PostgreSQL archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/postgres-dl
          key: postgres-dl-${{ hashFiles('Scripts/fetch-postgres.sh') }}
      - name: Fetch PostgreSQL (the tests boot a private cluster from it)
        run: ./Scripts/fetch-postgres.sh
      - name: Build
        id: package-build
        run: swift build
      # The storage and coordinator tests wait on PostgreSQL synchronously, from Swift's cooperative
      # threads (one per core). In one process with everything else they held all of the runner's
      # threads for the first minute (CI's samples: every thread in libpq, most in CREATE DATABASE),
      # so no other test ran and those that wait on a clock (MirrorSyncTests) timed out. They run in
      # a process of their own, then the rest, both on one cluster that a single test starts first.
      - name: Start the tests' PostgreSQL
        id: test-postgres-prewarm
        env:
          B4APP_TEST_POSTGRES_DIR: ${{ runner.temp }}/pg
        run: swift test --filter 'AccountRegistryTests/aLedgerIsCreatedOnlyWhenMissing'
      - name: Focused socket ownership and shutdown regressions
        id: socket-ownership-controls
        run: swift test --skip-build --filter 'SocketResponseOwnershipTests|SocketLifecycleTests|SocketClosePreservationTests|OwnedCloseConcurrencyTests|SocketServerShutdownTests'
      - name: Focused Agent Protocol transport regressions
        run: swift test --skip-build --filter AgentProtocolTransportTests
      - name: Sample owner-carrier build metadata (compiler controls held)
        id: owner-carrier-metadata
        if: ${{ !cancelled() && steps.package-build.outcome == 'success' && steps.socket-ownership-controls.outcome == 'success' }}
        timeout-minutes: 1
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          import math
          import os
          from pathlib import Path
          import re
          import stat
          import sys
          import tempfile

          MAX_INPUT = 4 * 1024 * 1024
          MAX_RECORD = 256 * 1024
          MAX_NODES = 16384
          MAX_DEPTH = 64
          SOURCE_PINS = {
              "Sources/Coordinator/HubSync/HubOwnerCarrier.swift": "61233c33d04d8a2318f025e727aec08107feb0dc72218f3d6fe2d1994c1d28b4",
              "Sources/Coordinator/Accounts/AccountManager.swift": "2f8d3f7c8dbf2469e7366530737532a3c41991a795f13f46b8d01155dfb6aa25",
              "Sources/Coordinator/HubSync/HubSync.swift": "65ef4d84c37d1f70485e6052bb71b8e5626c5348334ecef9a9e53f330146f3d5",
              "Sources/WorkspaceStorage/ProtocolActivation.swift": "f2b28e208e58686cc95954255643af14240042ceeb4092980cc68177ad7dd421",
              "Tests/CoordinatorTests/HubOwnerCarrierTests.swift": "08ee928189f0b79e70069afe4191a7d5e4564f5cb984bf9a3ad396e83683d27f",
          }

          RECEIPT_SOURCE_PINS = {'Sources/WorkspaceStorage/ProtocolActivation.swift': 'f2b28e208e58686cc95954255643af14240042ceeb4092980cc68177ad7dd421', 'Sources/WorkspaceStorage/WorkspaceDatabase.swift': '44b2fd4695903f1a6ef441becbabc01957105226316f0ed1e00dcc7f7a4cd6ae', 'Sources/WorkspaceStorage/PostgresClient.swift': 'e129b7fcf315bccb5659461cc7cbc16c0132b90e253568bd8e2942ff668106e2', 'Tests/WorkspaceStorageTests/OwnedProtocolProofWriteTests.swift': '647790c23cd2bc378450df8a5715ac46b35fade012cd9703cbe5770f57f0f0d5'}
          ACCOUNT_SESSION_SOURCE_PINS = {'Sources/WorkspaceStorage/LibPQ.swift': '054d7d50a95231af518dbebce4162f7a9284c8c1f3b7596bb62f930edcc88513', 'Sources/WorkspaceStorage/PostgresClient.swift': 'e129b7fcf315bccb5659461cc7cbc16c0132b90e253568bd8e2942ff668106e2', 'Sources/WorkspaceStorage/WorkspaceDatabase.swift': '44b2fd4695903f1a6ef441becbabc01957105226316f0ed1e00dcc7f7a4cd6ae', 'Sources/WorkspaceStorage/ProtocolActivation.swift': 'f2b28e208e58686cc95954255643af14240042ceeb4092980cc68177ad7dd421', 'Sources/Coordinator/HubSync/HubOwnerCarrier.swift': '61233c33d04d8a2318f025e727aec08107feb0dc72218f3d6fe2d1994c1d28b4', 'Sources/WorkspaceStorage/AccountSessionComparison.swift': '3209f1d507b6d40be025d6b6eadf3604fef76c6469600701a1dd6ecffc8b0598', 'Tests/WorkspaceStorageTests/AccountSessionComparisonTests.swift': '894ee2f79f4b9a14bab3c8ae86f89c097321b459392a1282b90fde7d82990054', 'Tests/CoordinatorTests/AccountSessionComparisonOwnerTests.swift': 'cde929ea622d7f768a0012346c42423b1d7849e8f55c8a56dc25896dc0f38f55'}
          HELPER_RELATIVE = "Scripts/check-owner-carrier-compiler-controls.py"
          HELPER_SHA256 = "36c67bbb716cde6145f0e1b8a1bc68ccb79daecf57775b3b8ac52c3ec836d251"

          class Rejected(Exception):
              pass

          def require(condition):
              if not condition:
                  raise Rejected()

          def safe_string(value):
              require(isinstance(value, str) and len(value) <= MAX_RECORD)
              require(not any(ord(c) < 32 or 127 <= ord(c) <= 159 for c in value))
              require(re.search(r"(?:bearer\s|secret:|secretref:|secret-reference:)", value, re.IGNORECASE) is None)
              return value

          def contained(path, anchor):
              require(path != anchor and path.is_relative_to(anchor))
              return path

          def read_regular(path, anchor, cap=MAX_INPUT):
              resolved = contained(path.resolve(strict=True), anchor)
              fd = os.open(resolved, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(fd, "rb") as stream:
                  before = os.fstat(stream.fileno())
                  require(stat.S_ISREG(before.st_mode) and 0 <= before.st_size <= cap)
                  data = stream.read(cap + 1)
                  after = os.fstat(stream.fileno())
                  require(len(data) <= cap and len(data) == before.st_size)
                  require((before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns)
                          == (after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns))
              return resolved, data

          def unique_object(pairs):
              result = {}
              for key, value in pairs:
                  require(key not in result)
                  result[key] = value
              return result

          def finite_float(value):
              parsed = float(value)
              require(math.isfinite(parsed))
              return parsed

          def reject_constant(_value):
              raise Rejected()

          def json_type(value):
              if value is None:
                  return "null"
              if isinstance(value, bool):
                  return "boolean"
              if isinstance(value, dict):
                  return "object"
              if isinstance(value, list):
                  return "array"
              if isinstance(value, str):
                  return "string"
              if isinstance(value, int):
                  return "integer"
              if isinstance(value, float):
                  return "number"
              raise Rejected()

          def typed_fields(value):
              require(len(value) <= 256)
              return [{"key": safe_string(key), "type": json_type(item)} for key, item in value.items()]

          def validate_selected(value):
              pending = [(value, 0)]
              count = 0
              while pending:
                  item, depth = pending.pop()
                  count += 1
                  require(count <= MAX_NODES and depth <= MAX_DEPTH)
                  if isinstance(item, dict):
                      require(len(item) <= MAX_NODES - count)
                      for key, child in item.items():
                          safe_string(key)
                          require(key.casefold() not in ("env", "environ", "environment"))
                          pending.append((key, depth + 1))
                          pending.append((child, depth + 1))
                  elif isinstance(item, list):
                      require(len(item) <= MAX_NODES - count)
                      pending.extend((child, depth + 1) for child in item)
                  elif isinstance(item, str):
                      safe_string(item)
                  elif isinstance(item, float):
                      require(math.isfinite(item))
                  else:
                      json_type(item)
                  require(len(pending) + count <= MAX_NODES)
              return count

          def main():
              checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
              require(checkout.is_dir())
              build = contained((checkout / ".build").resolve(strict=True), checkout)
              require(build.is_dir())
              description_path, description_bytes = read_regular(build / "debug/description.json", build)
              try:
                  description = json.loads(description_bytes.decode("utf-8"), object_pairs_hook=unique_object,
                                           parse_float=finite_float, parse_constant=reject_constant)
              except (ValueError, UnicodeError, RecursionError):
                  raise Rejected() from None
              require(isinstance(description, dict))
              top_fields = typed_fields(description)
              commands = description.get("swiftCommands")
              require(isinstance(commands, dict) and len(commands) <= 256)
              require(all(isinstance(command, dict) for command in commands.values()))
              selected = [(key, command) for key, command in commands.items()
                          if isinstance(command.get("moduleName"), str) and command["moduleName"] == "CoordinatorTests"]
              require(len(selected) == 1)
              selected_key, selected_command = selected[0]
              safe_string(selected_key)
              selected_nodes = validate_selected(selected_command)
              selected_fields = typed_fields(selected_command)

              module_path = description_path.parent / "Modules/Coordinator.swiftmodule"
              contained(module_path.resolve(strict=False), build)
              module_exists = os.path.lexists(module_path)
              if module_exists:
                  require(stat.S_ISREG(module_path.lstat().st_mode))
                  contained(module_path.resolve(strict=True), build)

              storage_path = description_path.parent / "Modules/WorkspaceStorage.swiftmodule"
              contained(storage_path.resolve(strict=False), build)
              storage_exists = os.path.lexists(storage_path)
              if storage_exists:
                  require(stat.S_ISREG(storage_path.lstat().st_mode))
                  contained(storage_path.resolve(strict=True), build)
              receipt_hashes = {}
              for relative, expected in RECEIPT_SOURCE_PINS.items():
                  _, content = read_regular(checkout / relative, checkout)
                  actual = hashlib.sha256(content).hexdigest()
                  require(actual == expected)
                  receipt_hashes[relative] = actual
              account_session_hashes = {}
              for relative, expected in ACCOUNT_SESSION_SOURCE_PINS.items():
                  _, content = read_regular(checkout / relative, checkout)
                  actual = hashlib.sha256(content).hexdigest()
                  require(actual == expected)
                  account_session_hashes[relative] = actual
              helper_path, helper_bytes = read_regular(checkout / HELPER_RELATIVE, checkout, MAX_RECORD)
              require(helper_path == checkout / HELPER_RELATIVE and 0 < len(helper_bytes) <= MAX_RECORD)
              require(hashlib.sha256(helper_bytes).hexdigest() == HELPER_SHA256)
              source_hashes = {}
              for relative, expected in SOURCE_PINS.items():
                  _, content = read_regular(checkout / relative, checkout)
                  actual = hashlib.sha256(content).hexdigest()
                  require(actual == expected)
                  source_hashes[relative] = actual
              _, workflow_bytes = read_regular(checkout / ".github/workflows/pr-180-qualification.yml", checkout)
              sha = os.environ["GITHUB_SHA"]
              run_id = os.environ["GITHUB_RUN_ID"]
              attempt = os.environ["GITHUB_RUN_ATTEMPT"]
              require(re.fullmatch(r"[0-9a-f]{40}", sha) is not None)
              require(re.fullmatch(r"[1-9][0-9]{0,19}", run_id) is not None)
              require(re.fullmatch(r"[1-9][0-9]{0,9}", attempt) is not None)
              record = {
                  "schema_version": 3,
                  "kind": "METADATA_ONLY_COMPILER_CONTROLS_HELD",
                  "compiler_controls": {"count": 6, "controls_per_bundle": 3, "bundles": ["origin", "receipt"], "status": "HELD", "semantic_vectors_qualified": False},
                  "semantic_fields_qualified": False,
                  "github": {"sha": sha, "run_id": run_id, "run_attempt": attempt},
                  "description": {"requested_relative_path": ".build/debug/description.json",
                                  "resolved_relative_path": safe_string(str(description_path.relative_to(checkout))),
                                  "sha256": hashlib.sha256(description_bytes).hexdigest(),
                                  "bytes": len(description_bytes), "top_level_fields": top_fields,
                                  "swift_commands_count": len(commands)},
                  "selected_command_key": selected_key,
                  "selected_command": selected_command,
                  "selected_command_fields": selected_fields,
                  "selected_tree_nodes": selected_nodes,
                  "source_sha256": source_hashes,
                  "receipt_source_sha256": receipt_hashes,
                  "account_session_source_sha256": account_session_hashes,
                  "account_session_controls": {'count': 27, 'controls_per_bundle': 3, 'bundles': ['p2b-package', 'p2b-storage-fields', 'p2b-coordinator', 'p2b-check-boundary', 'p2b-probe-boundary', 'p2b-reference-receipt', 'p2b-presence-authority', 'p2b-decoder-boundary', 'p2b-fileprivate-contexts'], 'status': 'HELD', 'semantic_vectors_qualified': False},
                  "compiler_helper": {"relative_path": HELPER_RELATIVE, "sha256": HELPER_SHA256,
                                      "bytes": len(helper_bytes)},
                  "storage_module": {"relative_to_description_parent": "Modules/WorkspaceStorage.swiftmodule",
                                     "exists": storage_exists, "freshness_proven": False, "import_proven": False},
                  "workflow_sha256": hashlib.sha256(workflow_bytes).hexdigest(),
                  "coordinator_module": {"relative_to_description_parent": "Modules/Coordinator.swiftmodule",
                                         "exists": module_exists, "freshness_proven": False, "import_proven": False},
              }
              encoded = (json.dumps(record, ensure_ascii=True, allow_nan=False, sort_keys=True,
                                    separators=(",", ":")) + "\n").encode("utf-8")
              require(len(encoded) <= MAX_RECORD)
              runner_temp = Path(os.environ["RUNNER_TEMP"]).resolve(strict=True)
              require(runner_temp.is_dir())
              output_directory = Path(tempfile.mkdtemp(prefix="owner-carrier-metadata-", dir=runner_temp))
              os.chmod(output_directory, 0o700)
              directory_info = output_directory.lstat()
              require(stat.S_ISDIR(directory_info.st_mode) and stat.S_IMODE(directory_info.st_mode) == 0o700)
              sample_path = contained(output_directory / "sample.json", runner_temp)
              safe_string(str(sample_path))
              fd = os.open(sample_path, os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW, 0o600)
              with os.fdopen(fd, "wb") as stream:
                  os.fchmod(stream.fileno(), 0o600)
                  require(stream.write(encoded) == len(encoded))
                  stream.flush()
                  os.fsync(stream.fileno())
                  info = os.fstat(stream.fileno())
                  require(stat.S_ISREG(info.st_mode) and info.st_size == len(encoded))
                  require(stat.S_IMODE(info.st_mode) == 0o600)
              final_info = sample_path.lstat()
              require(stat.S_ISREG(final_info.st_mode) and final_info.st_size == len(encoded))
              require(stat.S_IMODE(final_info.st_mode) == 0o600)
              require((final_info.st_dev, final_info.st_ino) == (info.st_dev, info.st_ino))
              output_path = contained(Path(os.environ["GITHUB_OUTPUT"]).resolve(strict=True), runner_temp)
              fd = os.open(output_path, os.O_WRONLY | os.O_APPEND | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(fd, "w", encoding="utf-8") as output:
                  require(stat.S_ISREG(os.fstat(output.fileno()).st_mode))
                  output_line = "sample-path=" + str(sample_path) + "\n"
                  require(output.write(output_line) == len(output_line))
                  output.flush()
              print("owner_carrier_metadata_finalized")
              print("description_sha256=" + record["description"]["sha256"])
              print("sample_sha256=" + hashlib.sha256(encoded).hexdigest())
              print("sample_bytes=" + str(len(encoded)))
              print("selected_tree_nodes=" + str(selected_nodes))
              print("swift_commands_count=" + str(len(commands)))
              print("source_hash_count=" + str(len(source_hashes)))

          try:
              main()
          except Rejected:
              print("owner_carrier_metadata_rejected", file=sys.stderr)
              sys.exit(1)
          except Exception:
              print("infrastructure_failure", file=sys.stderr)
              sys.exit(1)
          PY
      - name: Save owner-carrier metadata sample
        if: ${{ !cancelled() && steps.owner-carrier-metadata.outcome == 'success' }}
        timeout-minutes: 1
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: owner-carrier-metadata
          path: ${{ steps.owner-carrier-metadata.outputs.sample-path }}
          retention-days: 7
          if-no-files-found: error
      - name: Owner-carrier origin compiler access controls
        id: owner-carrier-origin-controls
        if: ${{ !cancelled() && steps.package-build.outcome == 'success' && steps.socket-ownership-controls.outcome == 'success' && steps.owner-carrier-metadata.outcome == 'success' }}
        timeout-minutes: 1
        env:
          OWNER_CARRIER_METADATA_SAMPLE: ${{ steps.owner-carrier-metadata.outputs.sample-path }}
        run: |
          python3 -I - origin <<'PY'
          try:
              import time
              START = time.monotonic()
              PARENT_END = START + 50.0
              import hashlib
              import os
              from pathlib import Path
              import stat
              import sys
              if len(sys.argv) != 2 or sys.argv[0] != "-" or sys.argv[1] not in ("origin", "receipt"):
                  raise ValueError()
              checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
              if not checkout.is_dir():
                  raise ValueError()
              relative = "Scripts/check-owner-carrier-compiler-controls.py"
              helper_path = (checkout / relative).resolve(strict=True)
              if helper_path != checkout / relative or not helper_path.is_relative_to(checkout):
                  raise ValueError()
              cap = 262144
              expected = "36c67bbb716cde6145f0e1b8a1bc68ccb79daecf57775b3b8ac52c3ec836d251"
              fd = os.open(helper_path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(fd, "rb") as stream:
                  before = os.fstat(stream.fileno())
                  if not stat.S_ISREG(before.st_mode) or not 0 < before.st_size <= cap:
                      raise ValueError()
                  helper_bytes = stream.read(cap + 1)
                  after = os.fstat(stream.fileno())
                  if len(helper_bytes) != before.st_size or len(helper_bytes) > cap:
                      raise ValueError()
                  if (before.st_dev, before.st_ino, before.st_size, before.st_mtime_ns, before.st_ctime_ns) != (
                          after.st_dev, after.st_ino, after.st_size, after.st_mtime_ns, after.st_ctime_ns):
                      raise ValueError()
              if hashlib.sha256(helper_bytes).hexdigest() != expected or time.monotonic() > START + 4.0:
                  raise ValueError()
              namespace = {"__name__": "__main__", "__file__": str(helper_path),
                           "BOOTSTRAP_START": START, "BOOTSTRAP_PARENT_END": PARENT_END,
                           "BOOTSTRAP_HELPER_RELATIVE": relative, "BOOTSTRAP_HELPER_SHA256": expected,
                           "BOOTSTRAP_HELPER_BYTES": len(helper_bytes)}
              exec(compile(helper_bytes, str(helper_path), "exec"), namespace, namespace)
          except BaseException:
              print('{"category":"owner_carrier_infrastructure_failure"}', flush=True)
              raise SystemExit(1)
          PY
      - name: Owner-carrier receipt compiler access controls
        id: owner-carrier-receipt-controls
        if: ${{ !cancelled() && steps.package-build.outcome == 'success' && steps.socket-ownership-controls.outcome == 'success' && steps.owner-carrier-metadata.outcome == 'success' && steps.owner-carrier-origin-controls.outcome == 'success' }}
        timeout-minutes: 1
        env:
          OWNER_CARRIER_METADATA_SAMPLE: ${{ steps.owner-carrier-metadata.outputs.sample-path }}
        run: |
          python3 -I - receipt <<'PY'
          try:
              import time
              START = time.monotonic()
              PARENT_END = START + 50.0
              import hashlib
              import os
              from pathlib import Path
              import stat
              import sys
              if len(sys.argv) != 2 or sys.argv[0] != "-" or sys.argv[1] not in ("origin", "receipt"):
                  raise ValueError()
              checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
              if not checkout.is_dir():
                  raise ValueError()
              relative = "Scripts/check-owner-carrier-compiler-controls.py"
              helper_path = (checkout / relative).resolve(strict=True)
              if helper_path != checkout / relative or not helper_path.is_relative_to(checkout):
                  raise ValueError()
              cap = 262144
              expected = "36c67bbb716cde6145f0e1b8a1bc68ccb79daecf57775b3b8ac52c3ec836d251"
              fd = os.open(helper_path, os.O_RDONLY | os.O_NOFOLLOW | os.O_NONBLOCK)
              with os.fdopen(fd, "rb") as stream:
                  before = os.fstat(stream.fileno())
                  if not stat.S_ISREG(before.st_mode) or not 0 < before.st_size <= cap:
                      raise ValueError()
                  helper_bytes = stream.read(cap + 1)
                  after = os.fstat(stream.fileno())
