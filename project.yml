# XcodeGen definition for the two thin app targets. Everything else lives in Package.swift.
# Regenerate with Scripts/generate-project.sh; the .xcodeproj and the generated Info.plist files are
# gitignored (decision D-003). Info.plist keys live under `info.properties` below.
name: B4App
options:
  bundleIdPrefix: com.cacheplane
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT: YES
    SWIFT_UPCOMING_FEATURE_INFER_ISOLATED_CONFORMANCES: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
# DEVELOPMENT_TEAM comes from Config/Signing.xcconfig and its gitignored local include, never from
# this file, because a value here would override the xcconfig (D-051).
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
packages:
  b4app:
    path: .
targets:
  B4App-macOS:
    type: application
    platform: macOS
    sources:
      - path: Apps/macOS/B4App
      - path: Apps/Shared/Assets.xcassets
    info:
      path: Apps/macOS/B4App/Info.plist
      properties:
        CFBundleDisplayName: Agent Workspace
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: Personal tool. Not for distribution.
    entitlements:
      path: Apps/macOS/B4App/B4App.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cacheplane.b4app
        PRODUCT_NAME: Agent Workspace
        # Xcode builds sign ad hoc; Scripts/package.sh re-signs the packaged app with a Developer ID
        # identity, its provisioning profile, and entitlements generated from the team id (D-051).
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        INFOPLIST_FILE: Apps/macOS/B4App/Info.plist
    dependencies:
      - package: b4app
        product: WorkspaceUI
      - package: b4app
        product: WorkspaceClient
      - package: b4app
        product: WorkspaceProtocol
      - package: b4app
        product: WorkspacePlatform
      - package: b4app
        product: NIOTransport
      - package: b4app
        product: Coordinator
  B4App-iOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS/B4App
      - path: Apps/Shared/Assets.xcassets
    info:
      path: Apps/iOS/B4App/Info.plist
      properties:
        CFBundleDisplayName: Agent Workspace
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # HTTPS through URLSession only: exempt from export documentation (TestFlight asks otherwise).
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Agent Workspace connects to your sync hub when it runs on your local network.
        # Plain HTTP only to the hub on this machine (the Simulator's localhost); HubURL refuses any
        # other non-HTTPS URL before a request is made. Debug only: the post-build script below
        # removes it from every other configuration, since on a device localhost is the phone.
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cacheplane.b4app.ios
        PRODUCT_NAME: Agent Workspace
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Apps/iOS/B4App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        # Simulator builds sign to run locally (the Keychain needs a signature); device builds and
        # archives sign automatically with the team from Config/Signing.xcconfig.
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        # The post-build script edits the processed Info.plist in the build folder.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Drop the localhost ATS exception outside Debug
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" != "Debug" ]; then
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$TARGET_BUILD_DIR/$INFOPLIST_PATH" 2>/dev/null || true
          fi
    dependencies:
      - package: b4app
        product: WorkspaceUI
      - package: b4app
        product: WorkspaceClient
      - package: b4app
        product: WorkspaceProtocol
      - package: b4app
        product: WorkspaceMirror
      - package: b4app
        product: WorkspaceSync
      - package: b4app
        product: WorkspaceSecrets
schemes:
  B4App-macOS:
    build:
      targets:
        B4App-macOS: all
    run:
      config: Debug
  B4App-iOS:
    build:
      targets:
        B4App-iOS: all
    run:
      config: Debug
