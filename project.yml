# XcodeGen definition for the two thin app targets. Everything else lives in Package.swift.
# Regenerate with Scripts/generate-project.sh; the .xcodeproj and the generated Info.plist files are
# gitignored (decision D-003). Info.plist keys live under `info.properties` below.
name: B4App
options:
  bundleIdPrefix: com.cacheplane
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  xcodeVersion: "26.6"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_UPCOMING_FEATURE_NONISOLATED_NONSENDING_BY_DEFAULT: YES
    SWIFT_UPCOMING_FEATURE_INFER_ISOLATED_CONFORMANCES: YES
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
# DEVELOPMENT_TEAM comes from Config/Signing.xcconfig and its gitignored local include, never from
# this file, because a value here would override the xcconfig (D-051).
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
packages:
  b4app:
    path: .
targets:
  B4App-macOS:
    type: application
    platform: macOS
    sources:
      - path: Apps/macOS/B4App
      - path: Apps/Shared/Assets.xcassets
    info:
      path: Apps/macOS/B4App/Info.plist
      properties:
        CFBundleDisplayName: Agent Workspace
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: Personal tool. Not for distribution.
    entitlements:
      path: Apps/macOS/B4App/B4App.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cacheplane.b4app
        PRODUCT_NAME: Agent Workspace
        # Xcode builds sign ad hoc; Scripts/package.sh re-signs the packaged app with a Developer ID
        # identity, its provisioning profile, and entitlements generated from the team id (D-051).
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        INFOPLIST_FILE: Apps/macOS/B4App/Info.plist
    dependencies:
      - package: b4app
        product: WorkspaceUI
      - package: b4app
        product: WorkspaceClient
      - package: b4app
        product: WorkspaceProtocol
      - package: b4app
        product: WorkspacePlatform
      - package: b4app
        product: NIOTransport
      - package: b4app
        product: Coordinator
  B4App-iOS:
    type: application
    platform: iOS
    sources:
      - path: Apps/iOS/B4App
      - path: Apps/Shared/Assets.xcassets
    info:
      path: Apps/iOS/B4App/Info.plist
      properties:
        CFBundleDisplayName: Agent Workspace
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        # HTTPS through URLSession only: exempt from export documentation (TestFlight asks otherwise).
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Agent Workspace connects to your sync hub when it runs on your local network.
        # Pairing (M8c): the QR code the Mac shows, scanned here or opened as a b4app://pair link.
        NSCameraUsageDescription: Scan the pairing code your Mac shows.
        CFBundleURLTypes:
          - CFBundleURLName: com.cacheplane.b4app.ios
            CFBundleURLSchemes:
              - b4app
        # The App Group the app and the widget share the mirror through, the scheme of the app's own
        # links (`<scheme>://thread/<id>`, `<scheme>://pair`), and the entitlements below live here so
        # flavour builds can override them (D-114). Keep the scheme in step with CFBundleURLSchemes.
        B4AppAppGroup: group.com.cacheplane.b4app
        B4AppURLScheme: b4app
        # A push with `content-available` wakes the app to pull before the banner is tapped (D-113).
        # `fetch` is for the Simulator only: `xcrun simctl push` delivers a content-available payload
        # as a background-fetch launch, which iOS refuses without it. On a device APNs wakes the app
        # through `remote-notification`, and the app never sets a minimum background-fetch interval,
        # so the system gives it no fetch wakes of its own. Debug only: the post-build script below
        # rewrites the array to `remote-notification` alone in every other configuration.
        UIBackgroundModes:
          - remote-notification
          - fetch
        # Plain HTTP only to the hub on this machine (the Simulator's localhost); HubURL refuses any
        # other non-HTTPS URL before a request is made. Debug only: the post-build script below
        # removes it from every other configuration, since on a device localhost is the phone.
        NSAppTransportSecurity:
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    # XcodeGen writes the tracked .entitlements file from these properties; flavour builds override them.
    entitlements:
      path: Apps/iOS/B4App/B4App.entitlements
      properties:
        aps-environment: development
        com.apple.security.application-groups:
          - group.com.cacheplane.b4app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cacheplane.b4app.ios
        PRODUCT_NAME: Agent Workspace
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_FILE: Apps/iOS/B4App/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        # Simulator builds sign to run locally (the Keychain needs a signature); device builds and
        # archives sign automatically with the team from Config/Signing.xcconfig.
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        # The post-build script edits the processed Info.plist in the build folder.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      - name: Drop the localhost ATS exception and the fetch background mode outside Debug
        basedOnDependencyAnalysis: false
        script: |
          if [ "$CONFIGURATION" != "Debug" ]; then
            plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Delete :UIBackgroundModes" "$plist" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :UIBackgroundModes array" \
              -c "Add :UIBackgroundModes:0 string remote-notification" "$plist"
          fi
    dependencies:
      - package: b4app
        product: WorkspaceUI
      - package: b4app
        product: WorkspaceClient
      - package: b4app
        product: WorkspaceProtocol
      - package: b4app
        product: WorkspaceMirror
      - package: b4app
        product: WorkspaceSync
      - package: b4app
        product: WorkspaceSecrets
      - target: B4App-iOSWidget
        embed: true
  # The attention widget (M8f, D-115): the top three threads, read from the mirror in the App Group.
  # The group id, the URL scheme, and the entitlements are here, as on the app, so flavour builds can
  # override them; the version keys must match the app's or embedding the extension fails.
  B4App-iOSWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Apps/iOSWidget
      - path: Apps/Shared/Assets.xcassets
    info:
      path: Apps/iOSWidget/Info.plist
      properties:
        CFBundleDisplayName: Agent Workspace
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        B4AppAppGroup: group.com.cacheplane.b4app
        B4AppURLScheme: b4app
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Apps/iOSWidget/B4AppWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.cacheplane.b4app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cacheplane.b4app.ios.widget
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
    dependencies:
      - package: b4app
        product: WorkspaceMirror
      - package: b4app
        product: WorkspaceProtocol
      - package: b4app
        product: WorkspaceUI
schemes:
  B4App-macOS:
    build:
      targets:
        B4App-macOS: all
    run:
      config: Debug
  B4App-iOS:
    build:
      targets:
        B4App-iOS: all
    run:
      config: Debug
