suite: secrets
templates:
  - templates/secret.yaml
  - templates/deployment.yaml
release:
  name: t
  namespace: hub
set:
  hub.publicUrl: https://hub.example.com
  hub.rpId: example.com
tests:
  - it: renders no Secret when both secrets are existing ones
    template: templates/secret.yaml
    set:
      database.existingSecret: hub-db
      secrets.existingSecret: hub-secrets
    asserts:
      - hasDocuments:
          count: 0

  - it: renders no hub Secret and no hub secret env before sign-in is configured
    set:
      database.existingSecret: hub-db
    asserts:
      - hasDocuments:
          count: 0
        template: templates/secret.yaml
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: B4HUB_SECRET_KEY}
          any: true
        template: templates/deployment.yaml
      - notContains:
          path: spec.template.spec.volumes
          content: {name: hub-secrets}
          any: true
        template: templates/deployment.yaml

  - it: creates the evaluation database Secret from urls as a pre-install hook
    template: templates/secret.yaml
    set:
      database.urls.url: postgres://b4hub_app:app@db/b4hub
      database.urls.adminUrl: postgres://postgres:admin@db/b4hub
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Secret
      - equal:
          path: metadata.name
          value: t-b4hub-db
      - equal:
          path: stringData
          value:
            DATABASE_URL: postgres://b4hub_app:app@db/b4hub
            DATABASE_ADMIN_URL: postgres://postgres:admin@db/b4hub
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: pre-install,pre-upgrade
      - equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "-10"

  - it: points the Deployment at the evaluation database Secret
    template: templates/deployment.yaml
    set:
      database.urls.url: postgres://b4hub_app:app@db/b4hub
      database.urls.adminUrl: postgres://postgres:admin@db/b4hub
    asserts:
      - contains:
          path: spec.template.spec.volumes
          content:
            name: db
            secret:
              secretName: t-b4hub-db
              defaultMode: 0440
              items:
                - key: DATABASE_URL
                  path: DATABASE_URL

  - it: creates the hub Secret from values with the documented keys
    template: templates/secret.yaml
    set:
      database.existingSecret: hub-db
      secrets.values.secretKey: c2VjcmV0
      secrets.values.appleTeamId: TEAM123
      secrets.values.appleKeyId: KEY123
      secrets.values.applePrivateKey: "-----BEGIN PRIVATE KEY-----\nabc\n-----END PRIVATE KEY-----\n"
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: t-b4hub-secrets
      - equal:
          path: stringData
          value:
            B4HUB_SECRET_KEY: c2VjcmV0
            B4HUB_APPLE_TEAM_ID: TEAM123
            B4HUB_APPLE_KEY_ID: KEY123
            B4HUB_APPLE_PRIVATE_KEY: "-----BEGIN PRIVATE KEY-----\nabc\n-----END PRIVATE KEY-----\n"
      - notExists:
          path: metadata.annotations["helm.sh/hook"]

  - it: exposes hub secrets as secretKeyRef env by default
    template: templates/deployment.yaml
    set:
      database.existingSecret: hub-db
      secrets.existingSecret: hub-secrets
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: B4HUB_SECRET_KEY
            valueFrom:
              secretKeyRef: {name: hub-secrets, key: B4HUB_SECRET_KEY}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: B4HUB_APPLE_TEAM_ID
            valueFrom:
              secretKeyRef: {name: hub-secrets, key: B4HUB_APPLE_TEAM_ID}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: B4HUB_APPLE_KEY_ID
            valueFrom:
              secretKeyRef: {name: hub-secrets, key: B4HUB_APPLE_KEY_ID}
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: B4HUB_APPLE_PRIVATE_KEY
            valueFrom:
              secretKeyRef: {name: hub-secrets, key: B4HUB_APPLE_PRIVATE_KEY}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: B4HUB_SECRET_KEY_FILE}
          any: true

  - it: mounts hub secrets as files and sets the _FILE variables when useFileVars is on
    template: templates/deployment.yaml
    set:
      database.existingSecret: hub-db
      secrets.existingSecret: hub-secrets
      secrets.useFileVars: true
    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: B4HUB_SECRET_KEY_FILE, value: /etc/b4hub/secrets/B4HUB_SECRET_KEY}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: B4HUB_APPLE_TEAM_ID_FILE, value: /etc/b4hub/secrets/B4HUB_APPLE_TEAM_ID}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: B4HUB_APPLE_KEY_ID_FILE, value: /etc/b4hub/secrets/B4HUB_APPLE_KEY_ID}
      - contains:
          path: spec.template.spec.containers[0].env
          content: {name: B4HUB_APPLE_PRIVATE_KEY_FILE, value: /etc/b4hub/secrets/B4HUB_APPLE_PRIVATE_KEY}
      - notContains:
          path: spec.template.spec.containers[0].env
          content: {name: B4HUB_SECRET_KEY}
          any: true
      - contains:
          path: spec.template.spec.volumes
          content:
            name: hub-secrets
            secret:
              secretName: hub-secrets
              defaultMode: 0440
              items:
                - {key: B4HUB_SECRET_KEY, path: B4HUB_SECRET_KEY}
                - {key: B4HUB_APPLE_TEAM_ID, path: B4HUB_APPLE_TEAM_ID}
                - {key: B4HUB_APPLE_KEY_ID, path: B4HUB_APPLE_KEY_ID}
                - {key: B4HUB_APPLE_PRIVATE_KEY, path: B4HUB_APPLE_PRIVATE_KEY}
      - contains:
          path: spec.template.spec.containers[0].volumeMounts
          content:
            name: hub-secrets
            mountPath: /etc/b4hub/secrets
            readOnly: true
