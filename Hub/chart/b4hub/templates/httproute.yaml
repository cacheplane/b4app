{{- if .Values.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "b4hub.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "b4hub.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    {{- if not .Values.httpRoute.parentRefs }}{{ fail "httpRoute.parentRefs needs at least one Gateway when httpRoute.enabled" }}{{ end }}
    {{- toYaml .Values.httpRoute.parentRefs | nindent 4 }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ include "b4hub.fullname" . }}
          port: {{ .Values.service.port }}
      {{- /* No timeouts key unless set: the hub holds WebSockets and 25 s long-polls open. */}}
      {{- with .Values.httpRoute.timeouts }}
      timeouts:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
