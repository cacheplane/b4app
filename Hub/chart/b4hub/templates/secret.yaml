{{- if include "b4hub.db.createSecret" . }}
# For evaluation only; use database.existingSecret in production. A pre-install hook so the
# migration Job (weight -5) can mount it; Helm does not delete hook resources on uninstall.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "b4hub.fullname" . }}-db
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "b4hub.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
type: Opaque
stringData:
  {{ .Values.database.secretKeys.url }}: {{ .Values.database.urls.url | quote }}
  {{ .Values.database.secretKeys.adminUrl }}: {{ .Values.database.urls.adminUrl | quote }}
{{- end }}
{{- if include "b4hub.secrets.createSecret" . }}
{{- with .Values.secrets.values }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "b4hub.fullname" $ }}-secrets
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "b4hub.labels" $ | nindent 4 }}
type: Opaque
stringData:
  B4HUB_SECRET_KEY: {{ .secretKey | quote }}
  B4HUB_APPLE_TEAM_ID: {{ .appleTeamId | quote }}
  B4HUB_APPLE_KEY_ID: {{ .appleKeyId | quote }}
  B4HUB_APPLE_PRIVATE_KEY: {{ .applePrivateKey | quote }}
{{- end }}
{{- end }}
