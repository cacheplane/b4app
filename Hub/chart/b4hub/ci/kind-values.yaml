# The kind install test (.github/workflows/hub-chart.yml): a CloudNativePG cluster in the
# default namespace and the b4hub-db Secret built from it as the README describes.
hub:
  publicUrl: http://b4hub.default.svc
  rpId: b4hub.default.svc
  signup: closed
database:
  existingSecret: b4hub-db
service:
  port: 80
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
# Required once sign-in merges: the sign-in hub's serve refuses to start without
# B4HUB_SECRET_KEY. Uncomment, and have the install job generate the key into a file and
# pass it with `--set-file secrets.values.secretKey=<file>` (never a --set value). Empty
# Apple values count as unset, so the chart-created Secret needs nothing else.
# secrets:
#   values:
#     secretKey: ""
