# The kind install test (.github/workflows/hub-chart.yml): a CloudNativePG cluster in the
# default namespace and the b4hub-db Secret built from it as the README describes.
hub:
  publicUrl: http://b4hub.default.svc
  rpId: b4hub.default.svc
  signup: closed
database:
  existingSecret: b4hub-db
service:
  port: 80
resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi
# The hub's serve refuses to start without B4HUB_SECRET_KEY. The install job
# (.github/scripts/chart-kind-test.sh) generates the key into a file and passes it with
# `--set-file secrets.values.secretKey=<file>` (never a --set value); the empty value here
# only documents the key. Empty Apple values count as unset, so the chart-created Secret
# needs nothing else. useFileVars is the default (true): the hub reads B4HUB_SECRET_KEY_FILE.
secrets:
  values:
    secretKey: ""
